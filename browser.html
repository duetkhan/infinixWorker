    /* =====================================================
       BROWSER
    ===================================================== */

    .browser-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }

    .browser-bar {
      padding: 12px;
      background: #ffffff;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .browser-search {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .browser-search input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 13px;
      border: 1px solid #dfe3ec;
      border-radius: 12px;
      outline: none;
      font-size: 14px;
    }

    .browser-search button {
      width: 46px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: #5b3df5;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .browser-tools {
      display: flex;
      gap: 8px;
      margin-top: 9px;
    }

    .browser-tools button {
      flex: 1;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: #f0edff;
      color: #5b3df5;
      font-size: 12px;
      font-weight: 700;
    }

    .browser-frame-wrap {
      width: 100%;
      min-height: calc(100vh - 230px);
      background: #fff;
    }

    #browserFrame {
      width: 100%;
      height: calc(100vh - 230px);
      min-height: 500px;
      border: 0;
      display: block;
      background: #fff;
    }

    /* =====================================================
       FIXED 320x50 BANNER
    ===================================================== */

    .fixed-banner {
      position: fixed;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      background: #fff;
      z-index: 9998;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 -2px 12px rgba(0,0,0,.12);
    }

    /* =====================================================
       VIDEO FULLSCREEN
    ===================================================== */

    #videoFullscreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #000;
      align-items: center;
      justify-content: center;
    }

    #videoFullscreen video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #closeVideoFullscreen {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 100000;
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: #fff;
      font-size: 22px;
    }

    /* Mobile landscape only for fullscreen video */
    @media screen and (orientation: landscape) {

      #videoFullscreen {
        width: 100vw;
        height: 100vh;
      }

      #videoFullscreen video {
        width: 100vw;
        height: 100vh;
      }
    }

  </style>
</head>

<!-- =======================================================
     FULLSCREEN VIDEO CONTAINER
======================================================== -->

<div id="videoFullscreen">

  <button
    id="closeVideoFullscreen"
    onclick="closeVideoFullscreen()">
    ✕
  </button>

  <video
    id="fullscreenVideo"
    controls
    playsinline
    webkit-playsinline>
  </video>

</div>


<script src="app.js"></script>


<script>

/* =========================================================
   SEARCH
========================================================= */

function searchWeb(event) {

  event.preventDefault();

  const input =
    document.getElementById("urlInput");

  let value =
    input.value.trim();

  if (!value) return;


  let url;


  /*
    Direct website:
    example.com
    youtube.com
  */

  if (
    value.startsWith("http://") ||
    value.startsWith("https://")
  ) {

    url = value;

  }

  else if (
    value.includes(".") &&
    !value.includes(" ")
  ) {

    url = "https://" + value;

  }

  else {

    url =
      "https://www.google.com/search?q=" +
      encodeURIComponent(value);

  }


  document.getElementById(
    "browserFrame"
  ).src = url;

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

  const frame =
    document.getElementById("browserFrame");

  try {
    frame.contentWindow.history.back();
  }
  catch(e) {}

}


/* =========================================================
   FORWARD
========================================================= */

function goForward() {

  const frame =
    document.getElementById("browserFrame");

  try {
    frame.contentWindow.history.forward();
  }
  catch(e) {}

}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

  const frame =
    document.getElementById("browserFrame");

  frame.src = frame.src;

}


/* =========================================================
   OPEN EXTERNAL
========================================================= */

function openCurrentExternal() {

  const frame =
    document.getElementById("browserFrame");

  window.open(
    frame.src,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   VIDEO FULLSCREEN SUPPORT
========================================================= */

/*
  If a video element is detected inside the iframe,
  try to use native fullscreen.

  Some external websites prevent this because of their
  own security/CSP/X-Frame-Options settings.
*/

document
  .getElementById("browserFrame")
  .addEventListener("load", function() {

    try {

      const frame =
        document.getElementById("browserFrame");

      const doc =
        frame.contentDocument ||
        frame.contentWindow.document;


      const videos =
        doc.querySelectorAll("video");


      videos.forEach(video => {

        video.addEventListener(
          "dblclick",
          function() {

            requestVideoFullscreen(video);

          }
        );

      });

    }
    catch(e) {

      /*
        Cross-origin websites cannot be controlled
        from this page. Native video fullscreen on
        those sites is controlled by the website itself.
      */

    }

  });


/* =========================================================
   REQUEST VIDEO FULLSCREEN
========================================================= */

function requestVideoFullscreen(video) {

  if (!video) return;


  /*
    Native fullscreen
  */

  if (video.requestFullscreen) {

    video.requestFullscreen();

  }

  else if (video.webkitEnterFullscreen) {

    video.webkitEnterFullscreen();

  }

}


/* =========================================================
   CUSTOM VIDEO FULLSCREEN
========================================================= */

function openCustomVideoFullscreen(src) {

  const box =
    document.getElementById(
      "videoFullscreen"
    );

  const video =
    document.getElementById(
      "fullscreenVideo"
    );


  video.src = src;

  box.style.display = "flex";

  video.play().catch(() => {});


  /*
    Try landscape orientation only while
    fullscreen video is active.
  */

  if (
    screen.orientation &&
    screen.orientation.lock
  ) {

    screen.orientation.lock("landscape")
      .catch(() => {});

  }

}


/* =========================================================
   CLOSE FULLSCREEN VIDEO
========================================================= */

function closeVideoFullscreen() {

  const box =
    document.getElementById(
      "videoFullscreen"
    );

  const video =
    document.getElementById(
      "fullscreenVideo"
    );


  video.pause();

  video.removeAttribute("src");

  video.load();

  box.style.display = "none";


  if (
    screen.orientation &&
    screen.orientation.unlock
  ) {

    try {
      screen.orientation.unlock();
    }
    catch(e) {}

  }

}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    if (
      typeof updateUserDisplays ===
      "function"
    ) {

      updateUserDisplays();

    }

  }
);

</script>
