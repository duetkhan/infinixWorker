<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Browser - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       BROWSER PAGE
    ===================================================== */

    .browser-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }


    /* =====================================================
       TOP SEARCH AREA
    ===================================================== */

    .browser-bar {
      padding: 14px 12px;
      background: #ffffff;
      box-shadow: 0 3px 12px rgba(0,0,0,.07);
      position: sticky;
      top: 0;
      z-index: 100;
    }


    .browser-search {
      display: flex;
      gap: 8px;
      align-items: center;
    }


    .browser-search input {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 15px;

      border: 1px solid #dfe5ef;
      border-radius: 14px;

      outline: none;

      font-size: 15px;
      font-family: inherit;

      background: #ffffff;
      color: #222;
    }


    .browser-search input:focus {
      border-color: #1769e0;
      box-shadow: 0 0 0 3px rgba(23,105,224,.08);
    }


    .browser-search button {
      width: 48px;
      height: 46px;

      border: 0;
      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #1769e0,
        #3289ed
      );

      color: #ffffff;

      font-size: 20px;
      cursor: pointer;

      box-shadow: 0 5px 14px rgba(23,105,224,.20);
    }


    /* =====================================================
       QUICK SEARCH
    ===================================================== */

    .browser-tools {
      display: flex;
      gap: 8px;

      margin-top: 10px;

      overflow-x: auto;
      scrollbar-width: none;
    }


    .browser-tools::-webkit-scrollbar {
      display: none;
    }


    .browser-tools button {
      flex: 0 0 auto;

      min-width: 82px;
      height: 38px;

      border: 0;
      border-radius: 12px;

      background: #edf4ff;
      color: #1769e0;

      font-size: 12px;
      font-weight: 700;

      padding: 0 14px;

      cursor: pointer;
    }


    .browser-tools button:active {
      transform: scale(.97);
    }


    /* =====================================================
       BROWSER STATUS
    ===================================================== */

    .browser-status {
      margin: 12px 12px 0;

      padding: 11px 14px;

      border-radius: 12px;

      background: #ffffff;

      color: #7c8799;

      font-size: 13px;

      box-shadow: 0 3px 12px rgba(0,0,0,.05);
    }


    /* =====================================================
       BROWSER CONTENT
    ===================================================== */

    .browser-frame-wrap {

      margin: 12px;

      background: #ffffff;

      border-radius: 18px;

      overflow: hidden;

      box-shadow: 0 5px 20px rgba(20,50,90,.08);

      min-height: 420px;
    }


    #browserFrame {

      display: block;

      width: 100%;

      height: 58vh;

      min-height: 420px;

      border: 0;

      background: #ffffff;
    }


    /* =====================================================
       FALLBACK MESSAGE
    ===================================================== */

    .browser-fallback {

      display: none;

      min-height: 420px;

      padding: 45px 25px;

      text-align: center;

      background: #ffffff;
    }


    .browser-fallback-icon {

      width: 72px;
      height: 72px;

      margin: 0 auto 18px;

      border-radius: 22px;

      background: #edf4ff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 32px;
    }


    .browser-fallback h3 {

      margin: 0 0 9px;

      color: #26364a;

      font-size: 19px;
    }


    .browser-fallback p {

      margin: 0 auto 20px;

      max-width: 290px;

      color: #8993a3;

      font-size: 13px;

      line-height: 1.6;
    }


    .browser-fallback button {

      border: 0;

      border-radius: 12px;

      padding: 12px 20px;

      background: #1769e0;

      color: #ffffff;

      font-family: inherit;

      font-weight: 700;

      cursor: pointer;
    }


    /* =====================================================
       FIXED BOTTOM 320x50
    ===================================================== */

    .fixed-banner {

      position: fixed;

      left: 50%;
      bottom: 68px;

      transform: translateX(-50%);

      width: 320px;
      height: 50px;

      max-width: calc(100vw - 10px);

      background: #ffffff;

      z-index: 9998;

      display: flex;

      justify-content: center;
      align-items: center;

      overflow: hidden;

      box-shadow:
        0 -2px 12px rgba(0,0,0,.12);
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 480px) {

      #browserFrame {
        height: 56vh;
        min-height: 390px;
      }

      .browser-frame-wrap {
        min-height: 390px;
      }

      .browser-fallback {
        min-height: 390px;
      }

    }

  </style>

</head>


<body>


<div id="app" class="browser-page">


  <!-- =====================================================
       TOP 320x50 AD
  ===================================================== -->

  <div class="ad-area top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <div class="page-header">

    <button
      class="back-btn"
      onclick="window.location.href='index.html'">
      ←
    </button>

    <div>

      <h1>Browser</h1>

      <p style="
        margin:4px 0 0;
        color:rgba(255,255,255,.88);
        font-size:13px;
      ">
        Search and browse inside Infinix Worker
      </p>

    </div>

  </div>


  <!-- =====================================================
       SEARCH
  ===================================================== -->

  <div class="browser-bar">

    <form
      class="browser-search"
      onsubmit="searchWeb(event)">

      <input
        id="urlInput"
        type="text"
        placeholder="Search or enter website"
        autocomplete="off">

      <button type="submit">
        🔎
      </button>

    </form>


    <div class="browser-tools">

      <button onclick="quickSearch('youtube')">
        YouTube
      </button>

      <button onclick="quickSearch('best football news')">
        Football News
      </button>

      <button onclick="quickSearch('facebook')">
        Facebook
      </button>

      <button onclick="quickSearch('instagram')">
        Instagram
      </button>

      <button onclick="reloadPage()">
        ↻ Reload
      </button>

    </div>

  </div>


  <!-- =====================================================
       STATUS
  ===================================================== -->

  <div
    id="browserStatus"
    class="browser-status">

    Ready to search

  </div>


  <!-- =====================================================
       BROWSER CONTENT
  ===================================================== -->

  <div class="browser-frame-wrap">


    <iframe
      id="browserFrame"
      title="Infinix Worker Browser"

      src="https://www.google.com/search?igu=1&q=Infinix%20Worker"

      allow="
        autoplay;
        fullscreen;
        picture-in-picture;
        encrypted-media;
        clipboard-read;
        clipboard-write
      "

      referrerpolicy="no-referrer-when-downgrade">
    </iframe>


    <!-- FALLBACK -->

    <div
      id="browserFallback"
      class="browser-fallback">

      <div class="browser-fallback-icon">
        🌐
      </div>

      <h3>
        This website cannot be displayed here
      </h3>

      <p>
        The website is blocking embedded viewing.
        Try another search or use the Open button
        to view the website directly.
      </p>

      <button onclick="openCurrentExternal()">
        Open Website
      </button>

    </div>


  </div>


  <!-- =====================================================
       FIXED BOTTOM 320x50 AD
  ===================================================== -->

  <div class="fixed-banner">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- =====================================================
       BOTTOM NAV
  ===================================================== -->

  <nav class="bottom-nav">

    <a href="index.html">

      <span class="nav-icon">⌂</span>

      <span>Home</span>

    </a>


    <a href="https://lsr-video-downloaders.vercel.app/">

      <span class="nav-icon">🌐</span>

      <span>Website</span>

    </a>


    <a
      href="https://t.me/bitbytee_bot"
      target="_blank"
      rel="noopener noreferrer">

      <span class="nav-icon">✈</span>

      <span>Telegram</span>

    </a>


    <button onclick="openProfile()">

      <span class="nav-icon">👤</span>

      <span>Profile</span>

    </button>


    <button onclick="openMore()">

      <span class="nav-icon">☰</span>

      <span>More</span>

    </button>

  </nav>


</div>


<!-- =======================================================
     APP JS
======================================================== -->

<script src="app.js"></script>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const browserFrame =
  document.getElementById("browserFrame");

const browserStatus =
  document.getElementById("browserStatus");

const browserFallback =
  document.getElementById("browserFallback");


let currentURL =
  browserFrame.src;


/* =========================================================
   UPDATE STATUS
========================================================= */

function setStatus(text) {

  browserStatus.textContent =
    text;

}


/* =========================================================
   SHOW FRAME
========================================================= */

function showFrame() {

  browserFrame.style.display =
    "block";

  browserFallback.style.display =
    "none";

}


/* =========================================================
   SHOW FALLBACK
========================================================= */

function showFallback() {

  browserFrame.style.display =
    "none";

  browserFallback.style.display =
    "block";

}


/* =========================================================
   GOOGLE SEARCH URL
========================================================= */

function googleSearch(query) {

  return (
    "https://www.google.com/search?igu=1&q=" +
    encodeURIComponent(query)
  );

}


/* =========================================================
   QUICK SEARCH
========================================================= */

function quickSearch(query) {

  const input =
    document.getElementById("urlInput");

  input.value =
    query;

  searchWeb(null);

}


/* =========================================================
   SEARCH / URL
========================================================= */

function searchWeb(event) {

  if (event) {

    event.preventDefault();

  }


  const input =
    document.getElementById("urlInput");


  let value =
    input.value.trim();


  if (!value) {

    return;

  }


  let url;


  /* -------------------------------------------------------
     FULL URL
  ------------------------------------------------------- */

  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {

    url =
      value;

  }


  /* -------------------------------------------------------
     DOMAIN
  ------------------------------------------------------- */

  else if (
    value.includes(".") &&
    !value.includes(" ")
  ) {

    url =
      "https://" +
      value;

  }


  /* -------------------------------------------------------
     NORMAL SEARCH
  ------------------------------------------------------- */

  else {

    url =
      googleSearch(value);

  }


  loadBrowserURL(
    url,
    value
  );

}


/* =========================================================
   LOAD URL
========================================================= */

function loadBrowserURL(
  url,
  label
) {

  currentURL =
    url;


  showFrame();


  setStatus(
    "Loading " +
    (label || url)
  );


  browserFrame.src =
    url;


  /*
    Some blocked websites won't fire a useful
    iframe error event. Give them a reasonable
    fallback after a delay.
  */

  clearTimeout(
    window.browserFallbackTimer
  );


  window.browserFallbackTimer =
    setTimeout(
      function() {

        /*
          Do not hide Google immediately.
          Google normally loads within this period.
        */

        if (
          browserFrame.src === url
        ) {

          setStatus(
            "Page loaded"
          );

        }

      },
      3500
    );

}


/* =========================================================
   BACK
========================================================= */

function goBack() {

  try {

    browserFrame.contentWindow.history.back();

    setStatus(
      "Going back..."
    );

  }
  catch(error) {

    setStatus(
      "Back is unavailable for this page"
    );

  }

}


/* =========================================================
   FORWARD
========================================================= */

function goForward() {

  try {

    browserFrame.contentWindow.history.forward();

    setStatus(
      "Going forward..."
    );

  }
  catch(error) {

    setStatus(
      "Forward is unavailable for this page"
    );

  }

}


/* =========================================================
   RELOAD
========================================================= */

function reloadPage() {

  showFrame();


  browserFrame.src =
    currentURL;


  setStatus(
    "Reloading..."
  );

}


/* =========================================================
   OPEN EXTERNAL
========================================================= */

function openCurrentExternal() {

  window.open(
    currentURL,
    "_blank",
    "noopener,noreferrer"
  );

}


/* =========================================================
   IFRAME LOAD
========================================================= */

browserFrame.addEventListener(
  "load",
  function() {

    setStatus(
      "Page loaded"
    );

  }
);


/* =========================================================
   INITIAL STATE
========================================================= */

window.addEventListener(
  "load",
  function() {

    currentURL =
      browserFrame.src;

    setStatus(
      "Ready"
    );

  }
);

</script>


</body>
</html>
