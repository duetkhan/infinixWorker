<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Browser - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    body {
      margin: 0;
      background: #f4f7fc;
    }

    .browser-page {
      min-height: 100vh;
      padding-bottom: 135px;
    }

    /* TOP AD */
    .browser-top-ad {
      width: 100%;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f4f7fc;
      overflow: hidden;
    }

    /* HEADER */
    .browser-header {
      background: linear-gradient(
        135deg,
        #0755c9,
        #398ce9
      );

      color: white;

      padding: 28px 22px 30px;

      border-radius: 0 0 45px 45px;

      display: flex;
      align-items: center;
      gap: 18px;
    }

    .browser-back {
      width: 64px;
      height: 64px;

      border: 0;
      border-radius: 20px;

      background: rgba(255,255,255,.18);

      color: white;

      font-size: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      flex-shrink: 0;
    }

    .browser-header h1 {
      margin: 0;
      font-size: 30px;
    }

    .browser-header p {
      margin: 6px 0 0;
      font-size: 14px;
      opacity: .9;
    }

    /* SEARCH CARD */
    .browser-search-card {
      background: white;

      margin: 28px 18px 16px;

      padding: 26px 20px;

      border-radius: 28px;

      box-shadow:
        0 8px 25px rgba(30,60,100,.08);
    }

    .browser-search-card h2 {
      margin: 0 0 20px;

      font-size: 23px;
      color: #26364a;
    }

    .browser-search-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .browser-search-row input {
      flex: 1;

      min-width: 0;

      height: 58px;

      border: 1px solid #dce3ed;

      border-radius: 18px;

      padding: 0 18px;

      font-size: 17px;

      outline: none;

      color: #333;
      background: #fff;
    }

    .browser-search-row input:focus {
      border-color: #1769e0;

      box-shadow:
        0 0 0 3px rgba(23,105,224,.08);
    }

    .browser-search-btn {
      width: 62px;
      height: 58px;

      border: 0;

      border-radius: 18px;

      background: linear-gradient(
        135deg,
        #1769e0,
        #3289ed
      );

      color: white;

      font-size: 25px;

      cursor: pointer;

      flex-shrink: 0;
    }

    /* QUICK SEARCH */
    .quick-search {
      display: flex;
      gap: 10px;

      margin-top: 18px;

      overflow-x: auto;

      scrollbar-width: none;
    }

    .quick-search::-webkit-scrollbar {
      display: none;
    }

    .quick-search button {
      flex: 0 0 auto;

      border: 0;

      border-radius: 15px;

      background: #edf4ff;

      color: #1769e0;

      padding: 12px 18px;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;
    }

    /* CONTENT */
    .browser-content-card {
      margin: 0 18px;

      background: white;

      border-radius: 25px;

      overflow: hidden;

      box-shadow:
        0 8px 25px rgba(30,60,100,.08);
    }

    .browser-content-top {
      height: 52px;

      padding: 0 16px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom: 1px solid #edf0f5;

      color: #718096;

      font-size: 14px;
    }

    .browser-reload {
      width: 40px;
      height: 40px;

      border: 0;

      border-radius: 14px;

      background: #edf4ff;

      color: #1769e0;

      font-size: 21px;

      cursor: pointer;
    }

    /*
      Important:
      No huge artificial gray area.
    */

    #browserFrame {
      display: block;

      width: 100%;

      height: 62vh;

      min-height: 400px;

      border: 0;

      background: white;
    }

    /* FALLBACK */
    #browserMessage {
      display: none;

      min-height: 300px;

      padding: 40px 25px;

      text-align: center;

      background: white;
    }

    #browserMessage .msg-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    #browserMessage h3 {
      margin: 0 0 8px;

      color: #27364a;
    }

    #browserMessage p {
      margin: 0;

      color: #8a94a5;

      font-size: 13px;

      line-height: 1.6;
    }

    /* FIXED BOTTOM AD */
    .browser-bottom-ad {
      position: fixed;

      left: 50%;
      bottom: 70px;

      transform: translateX(-50%);

      width: 320px;
      height: 50px;

      max-width: calc(100vw - 8px);

      background: white;

      z-index: 9990;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;

      box-shadow:
        0 -3px 14px rgba(0,0,0,.12);
    }

    @media (max-width: 480px) {

      .browser-header {
        padding: 25px 18px 28px;
      }

      .browser-header h1 {
        font-size: 27px;
      }

      .browser-search-card {
        margin: 22px 14px 14px;
      }

      .browser-content-card {
        margin: 0 14px;
      }

      #browserFrame {
        height: 58vh;
        min-height: 390px;
      }

    }
  </style>
</head>

<body>

<div class="browser-page">

  <!-- =====================================================
       TOP 320x50 AD
  ===================================================== -->

  <div class="browser-top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <div class="browser-header">

    <button
      class="browser-back"
      onclick="goHome()">
      ←
    </button>

    <div>

      <h1>Browser</h1>

      <p>
        Search and browse inside Infinix Worker
      </p>

    </div>

  </div>


  <!-- =====================================================
       GOOGLE SEARCH
  ===================================================== -->

  <div class="browser-search-card">

    <h2>
      Search anything with Google
    </h2>


    <form
      class="browser-search-row"
      onsubmit="googleSearch(event)">

      <input
        id="googleSearchInput"
        type="text"
        placeholder="Type something"
        autocomplete="off">

      <button
        class="browser-search-btn"
        type="submit">
        🔎
      </button>

    </form>


    <div class="quick-search">

      <button
        onclick="quickSearch('youtube')">
        YouTube
      </button>

      <button
        onclick="quickSearch('best football news')">
        Football News
      </button>

      <button
        onclick="quickSearch('facebook')">
        Facebook
      </button>

      <button
        onclick="quickSearch('instagram')">
        Instagram
      </button>

    </div>

  </div>


  <!-- =====================================================
       BROWSER CONTENT
  ===================================================== -->

  <div class="browser-content-card">

    <div class="browser-content-top">

      <span id="browserStatus">
        Search results
      </span>

      <button
        class="browser-reload"
        onclick="reloadBrowser()">
        ↻
      </button>

    </div>


    <iframe
      id="browserFrame"
      title="Infinix Worker Browser"

      src="https://www.google.com/search?igu=1"

      allow="
        autoplay;
        fullscreen;
        picture-in-picture;
        encrypted-media
      "

      referrerpolicy="no-referrer-when-downgrade">
    </iframe>


    <div id="browserMessage">

      <div class="msg-icon">
        🌐
      </div>

      <h3>
        Page cannot be displayed
      </h3>

      <p>
        This website does not allow embedded viewing.
        Try another Google search.
      </p>

    </div>

  </div>


  <!-- =====================================================
       FIXED BOTTOM 320x50
  ===================================================== -->

  <div class="browser-bottom-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- =====================================================
       BOTTOM NAV
  ===================================================== -->

  <nav class="bottom-nav">

    <a href="index.html">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>

    <a href="https://lsr-video-downloaders.vercel.app/">
      <span class="nav-icon">🌐</span>
      <span>Website</span>
    </a>

    <a
      href="https://t.me/bitbytee_bot"
      target="_blank"
      rel="noopener noreferrer">
      <span class="nav-icon">✈</span>
      <span>Telegram</span>
    </a>

    <button onclick="openProfile()">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>

    <button onclick="openMore()">
      <span class="nav-icon">☰</span>
      <span>More</span>
    </button>

  </nav>

</div>


<script src="app.js"></script>


<script>

/* =========================================================
   GOOGLE SEARCH
========================================================= */

function googleSearch(event) {

  if (event) {
    event.preventDefault();
  }


  const input =
    document.getElementById(
      "googleSearchInput"
    );


  const query =
    input.value.trim();


  if (!query) {
    return;
  }


  const frame =
    document.getElementById(
      "browserFrame"
    );


  const status =
    document.getElementById(
      "browserStatus"
    );


  const message =
    document.getElementById(
      "browserMessage"
    );


  frame.style.display =
    "block";

  message.style.display =
    "none";


  status.textContent =
    "Searching Google...";


  /*
    Google Search stays inside
    the Browser iframe.
  */

  frame.src =
    "https://www.google.com/search?igu=1&q=" +
    encodeURIComponent(query);


  setTimeout(
    function() {

      status.textContent =
        "Search results";

    },
    1800
  );

}


/* =========================================================
   QUICK SEARCH
========================================================= */

function quickSearch(query) {

  document
    .getElementById(
      "googleSearchInput"
    )
    .value = query;


  googleSearch(null);

}


/* =========================================================
   RELOAD
========================================================= */

function reloadBrowser() {

  const frame =
    document.getElementById(
      "browserFrame"
    );


  const status =
    document.getElementById(
      "browserStatus"
    );


  status.textContent =
    "Reloading...";


  frame.src =
    frame.src;

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

  window.location.href =
    "index.html";

}

</script>

</body>
</html>
