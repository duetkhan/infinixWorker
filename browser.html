<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <title>Browser - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

      background: #f4f7fc;

      overflow: hidden;
    }


    /* =====================================================
       MAIN BROWSER
    ===================================================== */

    .browser-page {

      width: 100%;
      height: 100vh;

      overflow: hidden;

      background: #f4f7fc;
    }


    /* =====================================================
       FIXED TOP BANNER
    ===================================================== */

    .browser-top-ad {

      position: fixed;

      top: 0;
      left: 50%;

      transform: translateX(-50%);

      width: 320px;
      height: 50px;

      max-width: 100vw;

      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      z-index: 10000;

      box-shadow:
        0 2px 10px rgba(0,0,0,.10);
    }


    /* =====================================================
       HEADER
    ===================================================== */

    .browser-header {

      position: fixed;

      top: 50px;
      left: 0;

      width: 100%;

      height: 105px;

      background:
        linear-gradient(
          135deg,
          #0755c9,
          #398ce9
        );

      color: #ffffff;

      border-radius:
        0 0 38px 38px;

      display: flex;
      align-items: center;

      padding:
        15px 20px;

      z-index: 9000;

      box-shadow:
        0 6px 20px rgba(20,80,160,.15);
    }


    .browser-back {

      width: 62px;
      height: 62px;

      border: 0;

      border-radius: 20px;

      background:
        rgba(255,255,255,.18);

      color: #ffffff;

      font-size: 34px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      flex-shrink: 0;
    }


    .browser-header-text {

      margin-left: 17px;
    }


    .browser-header h1 {

      margin: 0;

      font-size: 29px;
      line-height: 1.1;
    }


    .browser-header p {

      margin:
        6px 0 0;

      font-size: 13px;

      opacity: .92;
    }


    /* =====================================================
       SEARCH AREA
    ===================================================== */

    .browser-search-area {

      position: fixed;

      top: 166px;
      left: 0;

      width: 100%;

      padding:
        10px 14px 8px;

      background: #f4f7fc;

      z-index: 8000;
    }


    .browser-search-box {

      width: 100%;

      background: #ffffff;

      border-radius: 18px;

      padding: 7px;

      display: flex;

      gap: 7px;

      box-shadow:
        0 5px 18px rgba(30,60,100,.09);
    }


    .browser-search-box input {

      flex: 1;

      width: 100%;

      min-width: 0;

      height: 50px;

      border: 1px solid #e0e5ec;

      border-radius: 13px;

      padding:
        0 15px;

      outline: none;

      background: #ffffff;

      color: #222;

      font-family: inherit;

      font-size: 16px;
    }


    .browser-search-box input:focus {

      border-color: #1769e0;

      box-shadow:
        0 0 0 3px
        rgba(23,105,224,.08);
    }


    .browser-search-button {

      height: 50px;

      min-width: 92px;

      padding:
        0 17px;

      border: 0;

      border-radius: 13px;

      background:
        linear-gradient(
          135deg,
          #1769e0,
          #3289ed
        );

      color: #ffffff;

      font-family: inherit;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;

      box-shadow:
        0 4px 12px
        rgba(23,105,224,.20);
    }


    .browser-search-button:active {

      transform: scale(.98);
    }


    /* =====================================================
       RESULT STATUS
    ===================================================== */

    .browser-status {

      position: fixed;

      top: 230px;
      left: 0;

      width: 100%;

      height: 34px;

      padding:
        0 17px;

      display: flex;
      align-items: center;

      color: #778397;

      font-size: 12px;

      z-index: 7000;

      pointer-events: none;
    }


    /* =====================================================
       RESULT AREA
    ===================================================== */

    .browser-result {

      position: fixed;

      top: 264px;
      left: 0;

      width: 100%;

      /*
        Leave room for:
        bottom banner + navigation
      */

      bottom: 122px;

      padding:
        0 10px;

      z-index: 100;

      background: #f4f7fc;
    }


    .browser-result-card {

      width: 100%;
      height: 100%;

      background: #ffffff;

      border-radius:
        20px 20px 0 0;

      overflow: hidden;

      box-shadow:
        0 -2px 15px
        rgba(30,60,100,.06);
    }


    #browserFrame {

      display: block;

      width: 100%;
      height: 100%;

      border: 0;

      background: #ffffff;
    }


    /* =====================================================
       FALLBACK
    ===================================================== */

    #browserMessage {

      display: none;

      width: 100%;
      height: 100%;

      padding: 50px 25px;

      text-align: center;

      background: #ffffff;
    }


    #browserMessage .message-icon {

      font-size: 42px;

      margin-bottom: 12px;
    }


    #browserMessage h3 {

      margin:
        0 0 8px;

      color: #27364a;

      font-size: 18px;
    }


    #browserMessage p {

      margin: 0;

      color: #8993a3;

      font-size: 13px;

      line-height: 1.6;
    }


    /* =====================================================
       FIXED BOTTOM BANNER
    ===================================================== */

    .browser-bottom-ad {

      position: fixed;

      left: 50%;
      bottom: 68px;

      transform:
        translateX(-50%);

      width: 320px;
      height: 50px;

      max-width: 100vw;

      background: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      z-index: 10000;

      box-shadow:
        0 -3px 12px
        rgba(0,0,0,.12);
    }


    /* =====================================================
       BOTTOM NAV
    ===================================================== */

    .bottom-nav {

      position: fixed !important;

      left: 0 !important;
      bottom: 0 !important;

      width: 100% !important;

      height: 68px !important;

      z-index: 10001 !important;
    }


    /* =====================================================
       SMALL SCREEN
    ===================================================== */

    @media (max-width: 380px) {

      .browser-header {

        height: 100px;

        padding:
          12px 15px;
      }


      .browser-back {

        width: 56px;
        height: 56px;
      }


      .browser-header h1 {

        font-size: 26px;
      }


      .browser-header p {

        font-size: 12px;
      }


      .browser-search-area {

        top: 155px;
      }


      .browser-status {

        top: 219px;
      }


      .browser-result {

        top: 253px;
      }


      .browser-search-button {

        min-width: 82px;

        padding:
          0 10px;
      }

    }

  </style>

</head>


<body>


<div class="browser-page">


  <!-- =====================================================
       FIXED TOP 320x50 AD
  ===================================================== -->

  <div class="browser-top-ad">

    <script>

      atOptions = {

        'key' :
          'b529261b98306ae1169a6bf5b991c3d4',

        'format' :
          'iframe',

        'height' :
          50,

        'width' :
          320,

        'params' : {}

      };

    </script>


    <script
      src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js">
    </script>

  </div>


  <!-- =====================================================
       HEADER
  ===================================================== -->

  <div class="browser-header">


    <button
      class="browser-back"
      onclick="goHome()">

      ←

    </button>


    <div class="browser-header-text">

      <h1>
        Browser
      </h1>


      <p>
        Search and browse inside Infinix Worker
      </p>

    </div>

  </div>


  <!-- =====================================================
       SEARCH
  ===================================================== -->

  <div class="browser-search-area">

    <form
      class="browser-search-box"
      onsubmit="googleSearch(event)">


      <input
        id="googleSearchInput"
        type="text"
        placeholder="Search with Google"
        autocomplete="off">


      <button
        class="browser-search-button"
        type="submit">

        SEARCH

      </button>


    </form>

  </div>


  <!-- =====================================================
       STATUS
  ===================================================== -->

  <div
    id="browserStatus"
    class="browser-status">

    Search results

  </div>


  <!-- =====================================================
       GOOGLE RESULT
  ===================================================== -->

  <div class="browser-result">

    <div class="browser-result-card">


      <iframe
        id="browserFrame"

        title="Google Search"

        src="https://www.google.com/search?igu=1"

        allow="
          autoplay;
          fullscreen;
          picture-in-picture;
          encrypted-media
        "

        referrerpolicy="no-referrer-when-downgrade">
      </iframe>


      <div
        id="browserMessage">

        <div class="message-icon">
          🌐
        </div>


        <h3>
          Search page unavailable
        </h3>


        <p>
          Try another Google search.
        </p>

      </div>


    </div>

  </div>


  <!-- =====================================================
       FIXED BOTTOM 320x50 AD
  ===================================================== -->

  <div class="browser-bottom-ad">

    <script>

      atOptions = {

        'key' :
          'b529261b98306ae1169a6bf5b991c3d4',

        'format' :
          'iframe',

        'height' :
          50,

        'width' :
          320,

        'params' : {}

      };

    </script>


    <script
      src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js">
    </script>

  </div>


  <!-- =====================================================
       BOTTOM NAVIGATION
  ===================================================== -->

  <nav class="bottom-nav">


    <a href="index.html">

      <span class="nav-icon">
        ⌂
      </span>

      <span>
        Home
      </span>

    </a>


    <a
      href="https://lsr-video-downloaders.vercel.app/">

      <span class="nav-icon">
        🌐
      </span>

      <span>
        Website
      </span>

    </a>


    <a
      href="https://t.me/bitbytee_bot"
      target="_blank"
      rel="noopener noreferrer">

      <span class="nav-icon">
        ✈
      </span>

      <span>
        Telegram
      </span>

    </a>


    <button onclick="openProfile()">

      <span class="nav-icon">
        👤
      </span>

      <span>
        Profile
      </span>

    </button>


    <button onclick="openMore()">

      <span class="nav-icon">
        ☰
      </span>

      <span>
        More
      </span>

    </button>


  </nav>


</div>


<!-- =======================================================
     APP JS
======================================================== -->

<script src="app.js"></script>


<script>

/* =========================================================
   GOOGLE SEARCH
========================================================= */

function googleSearch(event) {

  if (event) {

    event.preventDefault();

  }


  const input =
    document.getElementById(
      "googleSearchInput"
    );


  const query =
    input.value.trim();


  if (!query) {

    input.focus();

    return;

  }


  const frame =
    document.getElementById(
      "browserFrame"
    );


  const status =
    document.getElementById(
      "browserStatus"
    );


  const message =
    document.getElementById(
      "browserMessage"
    );


  frame.style.display =
    "block";


  message.style.display =
    "none";


  status.textContent =
    "Searching Google...";


  /*
    Google result remains inside
    the Browser iframe.
  */

  frame.src =
    "https://www.google.com/search?igu=1&q=" +
    encodeURIComponent(query);


  setTimeout(
    function() {

      status.textContent =
        "Search results";

    },
    1200
  );

}


/* =========================================================
   RELOAD
========================================================= */

function reloadBrowser() {

  const frame =
    document.getElementById(
      "browserFrame"
    );


  const status =
    document.getElementById(
      "browserStatus"
    );


  status.textContent =
    "Reloading...";


  frame.src =
    frame.src;

}


/* =========================================================
   HOME
========================================================= */

function goHome() {

  window.location.href =
    "index.html";

}


/* =========================================================
   ENTER KEY
========================================================= */

document
  .getElementById(
    "googleSearchInput"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        googleSearch(event);

      }

    }
  );


/* =========================================================
   INITIAL STATUS
========================================================= */

document
  .getElementById(
    "browserFrame"
  )
  .addEventListener(
    "load",
    function() {

      document
        .getElementById(
          "browserStatus"
        )
        .textContent =
          "Search results";

    }
  );

</script>


</body>
</html>
