<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <meta name="theme-color" content="#0755c9">

  <title>Browser - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =====================================================
       INFINIX WORKER MINI BROWSER
    ===================================================== */

    .browser-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }


    /* =====================================================
       TOP BANNER
    ===================================================== */

    .browser-top-ad {
      width: 100%;
      min-height: 50px;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 3px 0;

      overflow: hidden;
    }


    /* =====================================================
       BROWSER HEADER
    ===================================================== */

    .browser-header {
      width: 100%;

      min-height: 72px;

      padding: 12px 15px;

      display: flex;
      align-items: center;

      gap: 11px;

      color: #fff;

      background:
        linear-gradient(
          135deg,
          #0755c9 0%,
          #1769e0 50%,
          #3d8cf1 100%
        );

      border-radius:
        0
        0
        24px
        24px;

      box-shadow:
        0 6px 20px rgba(15,91,202,.16);
    }


    .browser-back {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      padding: 0;

      border: 0;
      border-radius: 12px;

      background:
        rgba(255,255,255,.16);

      color: #fff;

      font-size: 22px;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    .browser-header-text {
      min-width: 0;
    }


    .browser-header-text strong {
      display: block;

      color: #fff;

      font-size: 18px;
      font-weight: 800;
    }


    .browser-header-text span {
      display: block;

      margin-top: 2px;

      color:
        rgba(255,255,255,.78);

      font-size: 10px;
    }


    /* =====================================================
       SEARCH CARD
    ===================================================== */

    .browser-search-card {

      margin: 13px 15px 0;

      padding: 14px;

      background: #fff;

      border-radius: 18px;

      box-shadow:
        0 6px 18px rgba(24,55,100,.08);
    }


    .browser-search-title {

      margin-bottom: 9px;

      color: #172033;

      font-size: 13px;
      font-weight: 750;
    }


    .browser-search-row {

      display: flex;

      align-items: center;

      gap: 8px;
    }


    .browser-search-row input {

      flex: 1;

      min-width: 0;

      height: 45px;

      padding:
        0
        12px;

      border:
        1px solid #dfe5ee;

      border-radius: 12px;

      background: #fff;

      color: #172033;

      outline: none;

      font-size: 13px;
    }


    .browser-search-row input:focus {

      border-color: #1769e0;

      box-shadow:
        0 0 0 3px
        rgba(23,105,224,.08);
    }


    .browser-search-btn {

      width: 45px;
      height: 45px;

      flex: 0 0 45px;

      border: 0;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #1769e0,
          #247cf0
        );

      color: #fff;

      font-size: 18px;

      box-shadow:
        0 5px 14px
        rgba(23,105,224,.18);
    }


    /* =====================================================
       QUICK SEARCH
    ===================================================== */

    .quick-search {

      display: flex;

      gap: 7px;

      margin-top: 10px;

      overflow-x: auto;

      scrollbar-width: none;
    }


    .quick-search::-webkit-scrollbar {
      display: none;
    }


    .quick-search button {

      flex: 0 0 auto;

      min-height: 33px;

      padding:
        0
        11px;

      border: 0;

      border-radius: 10px;

      background: #edf4ff;

      color: #1769e0;

      font-size: 10px;
      font-weight: 700;
    }


    /* =====================================================
       BROWSER CONTENT CARD
    ===================================================== */

    .browser-content-card {

      margin:
        12px
        15px
        0;

      background: #fff;

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 6px 18px rgba(24,55,100,.07);
    }


    .browser-content-top {

      min-height: 40px;

      padding:
        0
        12px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom:
        1px solid #edf1f6;
    }


    .browser-status {

      color: #788397;

      font-size: 10px;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      max-width: 80%;
    }


    .browser-refresh {

      width: 30px;
      height: 30px;

      padding: 0;

      border: 0;

      border-radius: 9px;

      background: #edf4ff;

      color: #1769e0;

      font-size: 15px;
    }


    /* =====================================================
       FRAME
    ===================================================== */

    .browser-frame-wrap {

      width: 100%;

      height:
        calc(100vh - 355px);

      min-height: 430px;

      max-height: 650px;

      background: #fff;

      overflow: hidden;
    }


    #browserFrame {

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background: #fff;
    }


    /* =====================================================
       BLOCKED / INFO MESSAGE
    ===================================================== */

    .browser-message {

      display: none;

      margin:
        10px
        12px;

      padding:
        11px
        12px;

      border-radius: 11px;

      background: #f5f8fc;

      color: #788397;

      font-size: 11px;

      line-height: 1.5;

      text-align: center;
    }


    /* =====================================================
       FIXED BOTTOM BANNER
    ===================================================== */

    .browser-fixed-ad {

      position: fixed;

      left: 50%;

      bottom: 70px;

      transform:
        translateX(-50%);

      width: 320px;

      max-width:
        calc(100vw - 10px);

      height: 50px;

      z-index: 900;

      display: flex;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      background: transparent;
    }


    /* =====================================================
       FULLSCREEN VIDEO
    ===================================================== */

    #videoFullscreen {

      display: none;

      position: fixed;

      inset: 0;

      z-index: 99999;

      background: #000;

      align-items: center;

      justify-content: center;
    }


    #videoFullscreen video {

      width: 100%;

      height: 100%;

      object-fit: contain;

      background: #000;
    }


    #closeVideoFullscreen {

      position: absolute;

      top: 12px;

      right: 12px;

      z-index: 100000;

      width: 42px;

      height: 42px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(0,0,0,.65);

      color: #fff;

      font-size: 21px;
    }


    /* =====================================================
       SMALL SCREEN
    ===================================================== */

    @media (max-width: 360px) {

      .browser-search-card {

        margin-left: 12px;
        margin-right: 12px;
      }

      .browser-content-card {

        margin-left: 12px;
        margin-right: 12px;
      }

      .browser-frame-wrap {

        min-height: 400px;
      }

    }

  </style>

</head>


<body>


<div
  id="app"
  class="browser-page"
>


  <!-- =====================================================
       TOP 320x50 AD
  ====================================================== -->

  <div class="browser-top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script
      src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js">
    </script>

  </div>


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="browser-header">

    <button
      class="browser-back"
      type="button"
      onclick="window.location.href='index.html'"
      aria-label="Back"
    >
      ←
    </button>


    <div class="browser-header-text">

      <strong>
        Browser
      </strong>

      <span>
        Search and browse inside Infinix Worker
      </span>

    </div>

  </header>


  <!-- =====================================================
       SEARCH
  ====================================================== -->

  <section class="browser-search-card">

    <div class="browser-search-title">
      Search anything with Google
    </div>


    <form
      class="browser-search-row"
      onsubmit="searchWeb(event)"
    >

      <input
        id="urlInput"
        type="text"
        inputmode="url"
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        placeholder="Type something"
      >


      <button
        class="browser-search-btn"
        type="submit"
        aria-label="Search"
      >
        🔎
      </button>

    </form>


    <!-- QUICK SEARCH -->

    <div class="quick-search">

      <button
        type="button"
        onclick="quickSearch('youtube')"
      >
        YouTube
      </button>

      <button
        type="button"
        onclick="quickSearch('best football news')"
      >
        Football News
      </button>

      <button
        type="button"
        onclick="quickSearch('facebook')"
      >
        Facebook
      </button>

      <button
        type="button"
        onclick="quickSearch('instagram')"
      >
        Instagram
      </button>

    </div>

  </section>


  <!-- =====================================================
       CONTENT
  ====================================================== -->

  <section class="browser-content-card">


    <div class="browser-content-top">

      <span
        id="browserStatus"
        class="browser-status"
      >
        Ready
      </span>


      <button
        type="button"
        class="browser-refresh"
        onclick="reloadPage()"
        aria-label="Refresh"
      >
        ↻
      </button>

    </div>


    <div class="browser-frame-wrap">

      <iframe
        id="browserFrame"
        title="Infinix Worker Browser"
        src="https://www.google.com/search?q=Infinix+Worker"
        allow="
          autoplay;
          fullscreen;
          picture-in-picture;
          encrypted-media;
          clipboard-read;
          clipboard-write
        "
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>

    </div>


    <div
      id="browserMessage"
      class="browser-message"
    ></div>

  </section>


  <!-- =====================================================
       FIXED BOTTOM 320x50
  ====================================================== -->

  <div class="browser-fixed-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script
      src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js">
    </script>

  </div>


  <!-- =====================================================
       BOTTOM NAVIGATION
  ====================================================== -->

  <nav class="bottom-nav">


    <a href="index.html">

      <span class="nav-icon">
        ⌂
      </span>

      <span>
        Home
      </span>

    </a>


    <a
      href="https://lsr-video-downloaders.vercel.app/"
    >

      <span class="nav-icon">
        🌐
      </span>

      <span>
        Website
      </span>

    </a>


    <a
      href="https://t.me/bitbytee_bot"
      target="_blank"
      rel="noopener noreferrer"
    >

      <span class="nav-icon">
        ✈
      </span>

      <span>
        Telegram
      </span>

    </a>


    <button
      type="button"
      onclick="openProfile()"
    >

      <span class="nav-icon">
        👤
      </span>

      <span>
        Profile
      </span>

    </button>


    <button
      type="button"
      onclick="openMore()"
    >

      <span class="nav-icon">
        ☰
      </span>

      <span>
        More
      </span>

    </button>


  </nav>


</div>


<!-- =====================================================
     FULLSCREEN VIDEO
====================================================== -->

<div id="videoFullscreen">

  <button
    id="closeVideoFullscreen"
    type="button"
    onclick="closeVideoFullscreen()"
  >
    ✕
  </button>


  <video
    id="fullscreenVideo"
    controls
    playsinline
    webkit-playsinline
  ></video>

</div>


<script src="app.js"></script>


<script>

/* =========================================================
   GET ELEMENTS
========================================================= */

const browserFrame =
  document.getElementById("browserFrame");

const urlInput =
  document.getElementById("urlInput");

const browserStatus =
  document.getElementById("browserStatus");

const browserMessage =
  document.getElementById("browserMessage");


/* =========================================================
   SEARCH / URL HANDLER
========================================================= */

function searchWeb(event) {

  event.preventDefault();

  let value =
    urlInput.value.trim();

  if (!value) return;


  let targetUrl;


  /*
    Full URL
  */

  if (
    value.startsWith("https://") ||
    value.startsWith("http://")
  ) {

    targetUrl = value;

  }


  /*
    Domain / website
  */

  else if (
    value.includes(".") &&
    !value.includes(" ")
  ) {

    targetUrl =
      "https://" + value;

  }


  /*
    Normal search
  */

  else {

    targetUrl =
      "https://www.google.com/search?q=" +
      encodeURIComponent(value);

  }


  loadBrowserPage(
    targetUrl,
    value
  );

}


/* =========================================================
   QUICK SEARCH
========================================================= */

function quickSearch(value) {

  urlInput.value = value;

  loadBrowserPage(
    "https://www.google.com/search?q=" +
    encodeURIComponent(value),
    value
  );

}


/* =========================================================
   LOAD PAGE
========================================================= */

function loadBrowserPage(
  url,
  label
) {

  browserMessage.style.display = "none";

  browserMessage.textContent = "";

  browserStatus.textContent =
    label || url;


  browserFrame.src = url;

}


/* =========================================================
   REFRESH
========================================================= */

function reloadPage() {

  try {

    browserFrame.src =
      browserFrame.src;

  }
  catch(error) {

    browserFrame.src =
      "https://www.google.com/";

  }

}


/* =========================================================
   IFRAME LOAD
========================================================= */

browserFrame.addEventListener(
  "load",
  function() {

    browserStatus.textContent =
      "Page loaded";

    /*
      Cross-origin iframe pages cannot be inspected
      from this app because of browser security.
    */

    try {

      const frameDocument =
        browserFrame.contentDocument ||
        browserFrame.contentWindow.document;


      const videos =
        frameDocument.querySelectorAll("video");


      videos.forEach(
        function(video) {

          video.addEventListener(
            "dblclick",
            function() {

              requestVideoFullscreen(video);

            }
          );

        }
      );

    }
    catch(error) {

      /*
        Normal for cross-origin pages.
      */

    }

  }
);


/* =========================================================
   IFRAME ERROR
========================================================= */

browserFrame.addEventListener(
  "error",
  function() {

    browserStatus.textContent =
      "Unable to load page";

  }
);


/* =========================================================
   NATIVE VIDEO FULLSCREEN
========================================================= */

function requestVideoFullscreen(video) {

  if (!video) return;


  if (
    typeof video.requestFullscreen ===
    "function"
  ) {

    video.requestFullscreen();

    return;

  }


  if (
    typeof video.webkitEnterFullscreen ===
    "function"
  ) {

    video.webkitEnterFullscreen();

  }

}


/* =========================================================
   CUSTOM FULLSCREEN VIDEO
========================================================= */

function openCustomVideoFullscreen(src) {

  if (!src) return;


  const box =
    document.getElementById(
      "videoFullscreen"
    );

  const video =
    document.getElementById(
      "fullscreenVideo"
    );


  video.src = src;

  box.style.display = "flex";


  video.play().catch(
    function() {}
  );


  if (
    screen.orientation &&
    screen.orientation.lock
  ) {

    screen.orientation
      .lock("landscape")
      .catch(
        function() {}
      );

  }

}


/* =========================================================
   CLOSE FULLSCREEN
========================================================= */

function closeVideoFullscreen() {

  const box =
    document.getElementById(
      "videoFullscreen"
    );

  const video =
    document.getElementById(
      "fullscreenVideo"
    );


  video.pause();

  video.removeAttribute("src");

  video.load();

  box.style.display = "none";


  if (
    screen.orientation &&
    screen.orientation.unlock
  ) {

    try {

      screen.orientation.unlock();

    }
    catch(error) {}

  }

}


/* =========================================================
   ENTER KEY
========================================================= */

urlInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      searchWeb(event);

    }

  }
);


/* =========================================================
   INITIAL STATUS
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    browserStatus.textContent =
      "Ready";

  }
);

</script>


</body>

</html>
