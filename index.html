<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Micro Tasks Web App">

  <title>Infinix Worker</title>

  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>

<body>

  <div id="app">

    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">IW</div>

        <div>
          <h1>Infinix Worker</h1>
          <span>Earn by completing tasks</span>
        </div>
      </div>

      <button class="notification-btn" aria-label="Notifications">
        🔔
      </button>
    </header>


    <!-- Main Content -->
    <main class="main-content">

      <!-- Balance Card -->
      <section class="balance-card">

        <div class="balance-info">
          <span class="balance-label">Available Balance</span>
          <strong id="balance">0.00</strong>
          <small>Coins</small>
        </div>

        <div class="balance-icon">
          💰
        </div>

      </section>


      <!-- Welcome -->
      <section class="welcome-section">
        <h2>Start earning today</h2>
        <p>Complete simple tasks and earn rewards.</p>
      </section>


      <!-- Main Actions -->
      <section class="action-grid">

        <button class="action-card" onclick="startWork()">
          <div class="action-icon">🚀</div>
          <div>
            <h3>Start Work</h3>
            <p>Complete available tasks</p>
          </div>
        </button>


        <button class="action-card" onclick="watchAd()">
          <div class="action-icon">▶️</div>
          <div>
            <h3>Watch Ad</h3>
            <p>Watch ads and earn</p>
          </div>
        </button>


        <button class="action-card" onclick="openWithdraw()">
          <div class="action-icon">💳</div>
          <div>
            <h3>Withdraw</h3>
            <p>Withdraw your balance</p>
          </div>
        </button>


        <button class="action-card" onclick="openProfile()">
          <div class="action-icon">👤</div>
          <div>
            <h3>Profile</h3>
            <p>Manage your account</p>
          </div>
        </button>

      </section>


      <!-- Native Ad -->
      <section class="native-ad">
        <div class="ad-label">Advertisement</div>

        <!-- Adsterra Native Banner will go here -->
        <div id="native-ad-container"></div>
      </section>


      <!-- 320x50 Banner -->
      <section class="banner-ad">
        <div class="ad-label">Advertisement</div>

        <div id="banner-ad-container"></div>
      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

      <button class="nav-item active" onclick="goHome()">
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button class="nav-item" onclick="startWork()">
        <span>⚡</span>
        <small>Work</small>
      </button>

      <button class="nav-item" onclick="watchAd()">
        <span>▶</span>
        <small>Ads</small>
      </button>

      <button class="nav-item" onclick="openWithdraw()">
        <span>💳</span>
        <small>Withdraw</small>
      </button>

      <button class="nav-item" onclick="openProfile()">
        <span>👤</span>
        <small>Profile</small>
      </button>

    </nav>

  </div>


  <!-- Smartlink / Popunder scripts will be integrated in Step 3 -->

  <script src="app.js"></script>

</body>
</html>
