<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0755c9">
  <title>LSR Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- TOP BLUE HEADER -->
  <header class="home-header">

    <button class="menu-btn" aria-label="Menu">
      ☰
    </button>

    <div class="home-brand">
      <div class="logo-box">
        <span>▶</span>
      </div>

      <div class="brand-title">
        <strong>LSR</strong>
        <small>Video Downloader</small>
      </div>
    </div>

    <div class="header-space"></div>

    <div class="home-tagline">
      Download&nbsp; • &nbsp;Watch&nbsp; • &nbsp;Enjoy
    </div>

  </header>


  <!-- WHITE CONTENT -->
  <main class="home-content">

    <!-- DOWNLOAD CARD -->
    <section class="download-card">

      <div class="url-box">
        <span class="url-icon">🔗</span>

        <input
          type="url"
          id="videoUrl"
          placeholder="Paste video link here..."
          autocomplete="off"
        >
      </div>


      <button class="download-btn" onclick="downloadVideo()">
        <span>⇩</span>
        Download
      </button>

    </section>


    <!-- FOUR MAIN CARDS -->
    <section class="home-grid">

      <button
        class="home-feature"
        onclick="location.href='downloader.html'"
      >
        <div class="feature-icon">⇩</div>

        <strong>Video Downloader</strong>

        <span>Download videos<br>from multiple sites</span>
      </button>


      <button
        class="home-feature"
        onclick="location.href='browser.html'"
      >
        <div class="feature-icon">◎</div>

        <strong>Browser</strong>

        <span>Browse the web<br>with built-in browser</span>
      </button>


      <button
        class="home-feature"
        onclick="location.href='downloads.html'"
      >
        <div class="feature-icon">▶</div>

        <strong>My Downloads</strong>

        <span>View and manage<br>your downloads</span>
      </button>


      <button
        class="home-feature"
        onclick="location.href='more.html'"
      >
        <div class="feature-icon">⚙</div>

        <strong>Settings</strong>

        <span>Customize your<br>experience</span>
      </button>

    </section>


    <!-- NATIVE AD -->
    <section class="native-ad">
      <div class="ad-label">Advertisement</div>
      <div id="native-ad-container"></div>
    </section>


    <!-- 320x50 AD -->
    <section class="banner-ad">
      <div class="ad-label">Advertisement</div>
      <div id="banner-ad-container"></div>
    </section>

  </main>


  <!-- BOTTOM NAVIGATION -->
  <nav class="bottom-nav">

    <button class="nav-item active">
      <span>⌂</span>
      <small>Home</small>
    </button>

    <button
      class="nav-item"
      onclick="location.href='downloader.html'"
    >
      <span>⇩</span>
      <small>Downloader</small>
    </button>

    <button
      class="nav-item"
      onclick="location.href='browser.html'"
    >
      <span>◎</span>
      <small>Browser</small>
    </button>

    <button
      class="nav-item"
      onclick="location.href='more.html'"
    >
      <span>•••</span>
      <small>More</small>
    </button>

  </nav>

</div>


<script src="app.js"></script>

<script>
function downloadVideo() {

  const url =
    document.getElementById("videoUrl").value.trim();

  if (!url) {
    alert("Please paste a video link first.");
    return;
  }

  /*
   * Smartlink can be triggered from the
   * user's explicit Download action.
   */

  if (typeof openSmartlink === "function") {
    openSmartlink();
  }

  /*
   * Real video downloading backend will
   * be connected separately.
   */

  alert("Download system will process this video link.");
}
</script>

</body>
</html>
