<script>

const USER_KEY = "iw_device_user";
const LOGIN_KEY = "worker_logged_in";


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

  const box = document.getElementById("loginMessage");

  box.textContent = text;

  box.className = "login-message " + type;

}


/* =========================================================
   SAVE COMPATIBILITY SESSION
   Firebase remains the real authentication system.
========================================================= */

async function saveFirebaseSession(user) {

  let username = "";

  try {

    const profileDoc =
      await firebaseDb
        .collection("profiles")
        .doc(user.uid)
        .get();

    if (profileDoc.exists) {

      const data = profileDoc.data();

      username =
        data.username ||
        "";

    }

  } catch (error) {

    console.log(
      "Profile read warning:",
      error
    );

  }


  localStorage.setItem(
    "worker_username",
    username
  );

  localStorage.setItem(
    "worker_email",
    user.email || ""
  );

  localStorage.setItem(
    LOGIN_KEY,
    "true"
  );

  /*
    Keep device marker for the existing
    one-device system.

    IMPORTANT:
    No password is stored here.
  */

  const existingDeviceUser =
    localStorage.getItem(USER_KEY);

  let deviceUser = {};

  if (existingDeviceUser) {

    try {

      deviceUser =
        JSON.parse(existingDeviceUser);

    } catch (error) {

      deviceUser = {};

    }

  }

  deviceUser.username =
    username ||
    deviceUser.username ||
    "";

  deviceUser.email =
    user.email ||
    deviceUser.email ||
    "";

  deviceUser.firebaseUid =
    user.uid;

  if (!deviceUser.createdAt) {

    deviceUser.createdAt =
      new Date().toISOString();

  }

  /*
    Remove old plaintext password if an
    old local account had one.
  */

  delete deviceUser.password;

  localStorage.setItem(
    USER_KEY,
    JSON.stringify(deviceUser)
  );

}


/* =========================================================
   CHECK FIREBASE LOGIN
========================================================= */

firebaseAuth.onAuthStateChanged(
  function(user) {

    if (user) {

      /*
        Firebase session already exists.
        Keep compatibility data synchronized.
      */

      saveFirebaseSession(user)
        .catch(function(error) {

          console.log(
            "Session sync warning:",
            error
          );

        });

    }

  }
);


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      const loginBtn =
        document.getElementById("loginBtn");


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";


      try {

        /*
          REAL FIREBASE LOGIN
        */

        const result =
          await firebaseAuth
            .signInWithEmailAndPassword(
              email,
              password
            );


        const user =
          result.user;


        /*
          Save only compatibility/session
          information locally.

          PASSWORD IS NEVER SAVED.
        */

        await saveFirebaseSession(user);


        showMessage(
          "Login successful. Redirecting...",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "index.html";

          },
          700
        );


      } catch (error) {

        console.error(
          "Firebase login error:",
          error
        );


        let message =
          "Login failed. Please check your email and password.";


        if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "Please enter a valid email address.";

        }
        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No account found with this email.";

        }
        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            "Incorrect password.";

        }
        else if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            "Invalid email or password.";

        }
        else if (
          error.code ===
          "auth/user-disabled"
        ) {

          message =
            "This account has been disabled.";

        }
        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Too many login attempts. Please try again later.";

        }
        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Network error. Please check your internet connection.";

        }


        showMessage(
          message,
          "error"
        );


        loginBtn.disabled = false;

        loginBtn.textContent =
          "Login";

      }

    }
  );


/* =========================================================
   REMOVE OLD PLAINTEXT PASSWORD
   This does not affect Firebase authentication.
========================================================= */

(function cleanupOldLocalPassword() {

  const savedUser =
    localStorage.getItem(USER_KEY);

  if (!savedUser) {
    return;
  }


  try {

    const user =
      JSON.parse(savedUser);


    if (
      Object.prototype.hasOwnProperty.call(
        user,
        "password"
      )
    ) {

      delete user.password;


      localStorage.setItem(
        USER_KEY,
        JSON.stringify(user)
      );

    }

  } catch (error) {

    console.log(
      "Old local account cleanup skipped."
    );

  }

})();

</script>
