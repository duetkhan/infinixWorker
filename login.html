<script>

/* =========================================================
   INFINIX WORKER - FIREBASE ONLY LOGIN

   Firebase Authentication is the ONLY authentication
   source.

   No browser storage is used for authentication.
========================================================= */


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "loginMessage"
    );

  if (!box) {
    return;
  }

  box.textContent =
    text;

  box.className =
    "login-message " +
    (
      type ||
      "info"
    );

}


/* =========================================================
   FIREBASE ERROR MESSAGE
========================================================= */

function firebaseErrorMessage(
  error
) {

  const code =
    error &&
    error.code
      ? error.code
      : "";


  switch (code) {

    case "auth/invalid-email":

      return (
        "Please enter a valid email address."
      );


    case "auth/user-not-found":

      return (
        "No account found with this email."
      );


    case "auth/wrong-password":

      return (
        "Incorrect password."
      );


    case "auth/invalid-credential":

      return (
        "Invalid email or password."
      );


    case "auth/user-disabled":

      return (
        "This account has been disabled."
      );


    case "auth/too-many-requests":

      return (
        "Too many login attempts. Please try again later."
      );


    case "auth/network-request-failed":

      return (
        "Network error. Please check your internet connection."
      );


    case "auth/operation-not-allowed":

      return (
        "Email/Password authentication is not enabled in Firebase."
      );


    case "auth/unauthorized-domain":

      return (
        "This website domain is not authorized in Firebase."
      );


    default:

      return (
        "Firebase error: " +
        (
          code ||
          (
            error &&
            error.message
          ) ||
          "Unknown error"
        )
      );

  }

}


/* =========================================================
   FIRESTORE PROFILE + WALLET
========================================================= */

async function ensureFirebaseUserData(
  user
) {

  if (
    !user ||
    !user.uid
  ) {

    throw new Error(
      "INVALID_FIREBASE_USER"
    );

  }


  const profileRef =
    firebaseDb
      .collection("profiles")
      .doc(user.uid);


  const walletRef =
    firebaseDb
      .collection("wallets")
      .doc(user.uid);


  let username = "";


  /* =======================================================
     READ EXISTING PROFILE
  ======================================================= */

  try {

    const profileSnap =
      await profileRef.get();


    if (
      profileSnap.exists
    ) {

      const data =
        profileSnap.data() || {};


      username =
        String(
          data.username || ""
        ).trim();

    }

  } catch (error) {

    console.warn(
      "Profile read warning:",
      error
    );

  }


  /* =======================================================
     CREATE PROFILE IF MISSING
  ======================================================= */

  if (!username) {

    username =
      String(
        user.displayName || ""
      ).trim();


    if (!username) {

      username =
        String(
          user.email || ""
        )
        .split("@")[0]
        .trim();

    }


    if (!username) {

      username =
        "User";

    }


    try {

      const profileSnap =
        await profileRef.get();


      if (
        !profileSnap.exists
      ) {

        await profileRef.set({

          username:
            username,

          email:
            user.email || "",

          balance:
            0,

          role:
            "user",

          createdAt:
            firebase.firestore
              .FieldValue
              .serverTimestamp()

        });

      } else {

        const profileData =
          profileSnap.data() || {};


        if (
          !profileData.username
        ) {

          await profileRef.update({

            username:
              username

          });

        }

      }

    } catch (error) {

      /*
        Firebase authentication is already
        successful. A Firestore problem here
        must NOT become a password error.
      */

      console.warn(
        "Profile create/update warning:",
        error
      );

    }

  }


  /* =======================================================
     CREATE WALLET IF MISSING
  ======================================================= */

  try {

    const walletSnap =
      await walletRef.get();


    if (
      !walletSnap.exists
    ) {

      await walletRef.set({

        userId:
          user.uid,

        balance:
          0,

        pending_balance:
          0,

        total_earned:
          0,

        total_withdrawn:
          0,

        createdAt:
          firebase.firestore
            .FieldValue
            .serverTimestamp()

      });

    }

  } catch (error) {

    /*
      Wallet initialization failure must NOT
      cancel an already successful Firebase login.
    */

    console.warn(
      "Wallet creation warning:",
      error
    );

  }


  return username;

}


/* =========================================================
   LOGIN FORM
========================================================= */

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById(
            "loginEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "loginPassword"
          )
          .value;


      const loginBtn =
        document.getElementById(
          "loginBtn"
        );


      if (
        !email ||
        !password
      ) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;

      }


      loginBtn.disabled =
        true;

      loginBtn.textContent =
        "Logging in...";


      /* =====================================================
         STEP 1
         FIREBASE AUTHENTICATION

         ONLY this step decides whether the
         email/password is valid.
      ===================================================== */

      let user;


      try {

        const result =
          await firebaseAuth
            .signInWithEmailAndPassword(
              email,
              password
            );


        user =
          result.user;

      } catch (error) {

        console.error(
          "Firebase authentication error:",
          error
        );


        showMessage(
          firebaseErrorMessage(
            error
          ),
          "error"
        );


        loginBtn.disabled =
          false;

        loginBtn.textContent =
          "Login";


        return;

      }


      /* =====================================================
         STEP 2
         AUTHENTICATION SUCCESSFUL
      ===================================================== */

      console.log(
        "Firebase authentication successful:",
        user.uid,
        user.email
      );


      showMessage(
        "Login successful. Loading your account...",
        "success"
      );


      /* =====================================================
         STEP 3
         PREPARE FIRESTORE ACCOUNT DATA

         Firestore errors are isolated.
      ===================================================== */

      try {

        await ensureFirebaseUserData(
          user
        );

      } catch (error) {

        console.warn(
          "Firestore account preparation warning:",
          error
        );

      }


      /* =====================================================
         STEP 4
         ROLE-BASED REDIRECT

         Firebase Auth confirms the login.
         Firestore profile role decides where
         the authenticated account is sent:

         admin -> admin.html
         user  -> index.html
      ===================================================== */

      let redirectPage =
        "index.html";

      try {

        const profileSnap =
          await firebaseDb
            .collection("profiles")
            .doc(user.uid)
            .get();

        if (profileSnap.exists) {

          const profileData =
            profileSnap.data() || {};

          const role =
            String(
              profileData.role || "user"
            )
            .trim()
            .toLowerCase();

          if (role === "admin") {
            redirectPage =
              "admin.html";
          }

        }

      } catch (error) {

        /*
          Login is already successful.
          If the role cannot be read, use the
          normal user dashboard as the safe fallback.
        */

        console.warn(
          "Role read warning:",
          error
        );

      }


      console.log(
        "Login redirect:",
        redirectPage
      );


      showMessage(
        "Login successful. Redirecting...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            redirectPage;

        },
        700
      );

    }
  );


/* =========================================================
   FIREBASE SESSION LISTENER

   Firebase handles session persistence.
   No browser storage login flag is needed.
========================================================= */

firebaseAuth.onAuthStateChanged(
  function(user) {

    if (user) {

      console.log(
        "Firebase session available:",
        user.uid,
        user.email
      );

    }

  }
);

</script>
