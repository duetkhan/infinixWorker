<script>

const USER_KEY = "iw_device_user";
const LOGIN_KEY = "worker_logged_in";


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text, type) {

  const box = document.getElementById("loginMessage");

  box.textContent = text;

  box.className = "login-message " + type;

}


/* =========================================================
   GET OLD LOCAL USER
   Used only for compatibility.

   IMPORTANT:
   Password is NEVER read or saved.
========================================================= */

function getOldLocalUser() {

  const saved = localStorage.getItem(USER_KEY);

  if (!saved) {
    return null;
  }

  try {

    const user = JSON.parse(saved);

    if (!user || typeof user !== "object") {
      return null;
    }

    return user;

  } catch (error) {

    return null;

  }

}


/* =========================================================
   CREATE / SYNC FIRESTORE PROFILE + WALLET
========================================================= */

async function prepareFirebaseUser(user) {

  if (!user || !user.uid) {
    throw new Error("INVALID_FIREBASE_USER");
  }

  const profileRef =
    firebaseDb
      .collection("profiles")
      .doc(user.uid);

  const walletRef =
    firebaseDb
      .collection("wallets")
      .doc(user.uid);


  const oldUser = getOldLocalUser();


  /*
    First read profile.
  */

  const profileSnap =
    await profileRef.get();


  let username = "";


  if (profileSnap.exists) {

    const profileData =
      profileSnap.data() || {};

    username =
      profileData.username ||
      "";

  }


  /*
    If Firebase profile does not have username,
    use old local username only when the email
    belongs to the same Firebase account.
  */

  if (!username && oldUser) {

    const oldEmail =
      String(oldUser.email || "")
        .trim()
        .toLowerCase();

    const firebaseEmail =
      String(user.email || "")
        .trim()
        .toLowerCase();

    if (
      oldEmail &&
      firebaseEmail &&
      oldEmail === firebaseEmail &&
      oldUser.username
    ) {

      username =
        String(oldUser.username).trim();

    }

  }


  /*
    Final fallback.
  */

  if (!username) {

    const emailName =
      String(user.email || "")
        .split("@")[0]
        .trim();

    username =
      emailName || "worker";

  }


  /*
    Create profile if missing.
    If profile exists, only fill missing username/email/balance.
  */

  if (!profileSnap.exists) {

    await profileRef.set({

      username: username,

      email: user.email || "",

      balance: 0,

      role: "user",

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    });

  } else {

    const profileData =
      profileSnap.data() || {};

    const updateData = {};


    if (!profileData.username) {

      updateData.username =
        username;

    }


    if (!profileData.email) {

      updateData.email =
        user.email || "";

    }


    if (
      typeof profileData.balance !== "number"
    ) {

      updateData.balance = 0;

    }


    if (
      !profileData.role
    ) {

      updateData.role = "user";

    }


    if (
      Object.keys(updateData).length > 0
    ) {

      await profileRef.update(
        updateData
      );

    }

  }


  /*
    Create wallet if missing.
  */

  const walletSnap =
    await walletRef.get();


  if (!walletSnap.exists) {

    await walletRef.set({

      balance: 0,

      pending_balance: 0,

      total_earned: 0,

      total_withdrawn: 0,

      userId: user.uid,

      createdAt:
        firebase.firestore.FieldValue
          .serverTimestamp()

    });

  }


  /*
    Return username for local compatibility.
  */

  return username;

}


/* =========================================================
   SAVE FIREBASE SESSION
========================================================= */

async function saveFirebaseSession(user) {

  const username =
    await prepareFirebaseUser(user);


  localStorage.setItem(
    "worker_username",
    username
  );


  localStorage.setItem(
    "worker_email",
    user.email || ""
  );


  localStorage.setItem(
    LOGIN_KEY,
    "true"
  );


  /*
    Preserve device marker,
    but NEVER store password.
  */

  const oldUser =
    getOldLocalUser() || {};


  const deviceUser = {

    username:
      username ||
      oldUser.username ||
      "",

    email:
      user.email ||
      oldUser.email ||
      "",

    firebaseUid:
      user.uid,

    createdAt:
      oldUser.createdAt ||
      new Date().toISOString()

  };


  delete deviceUser.password;


  localStorage.setItem(
    USER_KEY,
    JSON.stringify(deviceUser)
  );

}


/* =========================================================
   FIREBASE AUTH STATE
========================================================= */

firebaseAuth.onAuthStateChanged(
  function(user) {

    /*
      Do not redirect automatically here.

      This prevents the login page from
      fighting with the form while Firebase
      restores an old session.
    */

    if (user) {

      console.log(
        "Firebase session detected:",
        user.email
      );

    }

  }
);


/* =========================================================
   LOGIN
========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("loginPassword")
          .value;


      const loginBtn =
        document.getElementById(
          "loginBtn"
        );


      if (!email || !password) {

        showMessage(
          "Please enter your email and password.",
          "error"
        );

        return;

      }


      loginBtn.disabled = true;

      loginBtn.textContent =
        "Logging in...";


      try {

        /*
          REAL FIREBASE LOGIN
        */

        const result =
          await firebaseAuth
            .signInWithEmailAndPassword(
              email,
              password
            );


        const user =
          result.user;


        /*
          Make sure Firebase profile
          and wallet exist.
        */

        await saveFirebaseSession(
          user
        );


        showMessage(
          "Login successful. Redirecting...",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "index.html";

          },
          700
        );


      } catch (error) {

        console.error(
          "Firebase login error:",
          error
        );


        let message =
          "Login failed. Please check your email and password.";


        if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "Please enter a valid email address.";

        }

        else if (
          error.code ===
          "auth/user-not-found"
        ) {

          message =
            "No account found with this email.";

        }

        else if (
          error.code ===
          "auth/wrong-password"
        ) {

          message =
            "Incorrect password.";

        }

        else if (
          error.code ===
          "auth/invalid-credential"
        ) {

          message =
            "Invalid email or password.";

        }

        else if (
          error.code ===
          "auth/user-disabled"
        ) {

          message =
            "This account has been disabled.";

        }

        else if (
          error.code ===
          "auth/too-many-requests"
        ) {

          message =
            "Too many login attempts. Please try again later.";

        }

        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Network error. Please check your internet connection.";

        }

        else if (
          error.code ===
          "permission-denied"
        ) {

          message =
            "Firebase permission denied. Please check Firestore rules.";

        }

        else if (
          error.message
        ) {

          console.error(
            "Firebase error detail:",
            error.message
          );

        }


        showMessage(
          message,
          "error"
        );


        loginBtn.disabled = false;

        loginBtn.textContent =
          "Login";

      }

    }
  );


/* =========================================================
   REMOVE OLD PLAINTEXT PASSWORD
========================================================= */

(function cleanupOldLocalPassword() {

  const saved =
    localStorage.getItem(
      USER_KEY
    );


  if (!saved) {
    return;
  }


  try {

    const user =
      JSON.parse(saved);


    if (
      user &&
      Object.prototype.hasOwnProperty.call(
        user,
        "password"
      )
    ) {

      delete user.password;


      localStorage.setItem(
        USER_KEY,
        JSON.stringify(user)
      );

    }

  } catch (error) {

    console.log(
      "Old local account cleanup skipped."
    );

  }

})();

</script>
