<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="style.css">

  <style>
    .more-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }

    .top-ad {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 8px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .more-header {
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      padding: 15px 16px 18px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 5px 18px rgba(23,105,224,.20);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      width: 39px;
      height: 39px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.16);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .more-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .more-header p {
      margin: 3px 0 0;
      font-size: 11px;
      opacity: .9;
    }

    .more-content {
      padding: 16px;
    }

    .more-intro {
      background: #fff;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px rgba(25,35,60,.07);
    }

    .more-intro h2 {
      margin: 0 0 6px;
      color: #20283a;
      font-size: 19px;
      font-weight: 800;
    }

    .more-intro p {
      margin: 0;
      color: #737b8d;
      font-size: 13px;
      line-height: 1.5;
    }

    .more-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .more-item {
      width: 100%;
      min-height: 65px;
      padding: 11px 14px;
      border: 0;
      background: #fff;
      border-radius: 17px;
      box-shadow: 0 5px 16px rgba(25,35,60,.07);
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      color: #172033;
    }

    .more-item:active {
      transform: scale(.985);
    }

    .more-icon {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      border-radius: 13px;
      background: #eaf2ff;
      color: #1769e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .more-text {
      flex: 1;
      min-width: 0;
    }

    .more-text strong {
      display: block;
      color: #20283a;
      font-size: 14px;
      margin-bottom: 3px;
      font-weight: 800;
    }

    .more-text small {
      display: block;
      color: #858c9b;
      font-size: 11px;
      line-height: 1.35;
    }

    .more-arrow {
      color: #9aa1af;
      font-size: 21px;
      flex: 0 0 auto;
    }

    .native-ad {
      width: 100%;
      min-height: 100px;
      margin: 12px 0;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }

    .below-banner {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>
