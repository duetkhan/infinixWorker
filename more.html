<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>More - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .more-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }

    .more-intro {
      background: #fff;
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 14px;
      box-shadow: 0 5px 18px rgba(25,35,60,.07);
    }

    .more-intro h2 {
      font-size: 19px;
      margin-bottom: 6px;
    }

    .more-intro p {
      color: #737b8d;
      font-size: 13px;
      line-height: 1.5;
    }

    .more-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .more-item {
      width: 100%;
      min-height: 62px;
      padding: 11px 14px;
      border: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(25,35,60,.06);
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      color: #172033;
    }

    .more-icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      background: #f0edff;
      color: #5b3df5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .more-text {
      flex: 1;
      min-width: 0;
    }

    .more-text strong {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .more-text small {
      display: block;
      color: #858c9b;
      font-size: 11px;
      line-height: 1.35;
    }

    .more-arrow {
      color: #9aa1af;
      font-size: 18px;
    }

    .fixed-banner {
      position: fixed;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      background: #fff;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 -2px 12px rgba(0,0,0,.12);
    }
  </style>
</head>

      atOptions = {

      <!-- MY DOWNLOADS -->
