<script>


/* =========================
   LOAD PROFILE
========================= */

function loadProfile(){

    const username =
        localStorage.getItem(
            "worker_username"
        ) || "Guest User";


    const email =
        localStorage.getItem(
            "worker_email"
        ) || "Not logged in";


    const balance =
        Number(
            localStorage.getItem(
                "worker_balance"
            ) || 0
        );


    document.getElementById(
        "username"
    ).textContent =
        username;


    document.getElementById(
        "email"
    ).textContent =
        email;


    document.getElementById(
        "balance"
    ).textContent =
        balance.toFixed(2);


    loadHistory();

}



/* =========================
   LOAD HISTORY
========================= */

function loadHistory(){

    const history =
        JSON.parse(
            localStorage.getItem(
                "withdraw_history"
            ) || "[]"
        );


    const container =
        document.getElementById(
            "history"
        );


    if(history.length === 0){

        container.innerHTML =
            `
            <p class="empty">
                No withdrawal history yet.
            </p>
            `;

        return;

    }


    container.innerHTML =
        history.map(function(item){

            return `

            <div class="history-row">

                <b>
                    ${Number(
                        item.amount
                    ).toFixed(2)}
                </b>


                <span>

                    ${item.number}

                    <br>

                    <small>
                        ${item.date}
                        •
                        ${item.status}
                    </small>

                </span>

            </div>

            `;

        }).join("");

}



/* =========================
   SUBMIT WITHDRAW
========================= */

function submitWithdraw(){

    const number =
        document.getElementById(
            "paymentNumber"
        ).value.trim();


    const amount =
        Number(
            document.getElementById(
                "withdrawAmount"
            ).value
        );


    const message =
        document.getElementById(
            "withdrawMessage"
        );


    const balance =
        Number(
            localStorage.getItem(
                "worker_balance"
            ) || 0
        );



    /* NUMBER CHECK */

    if(!number){

        message.textContent =
            "Please enter your payment number.";

        return;

    }



    /* AMOUNT CHECK */

    if(
        !amount ||
        amount < 110 ||
        amount > 5000
    ){

        message.textContent =
            "Amount must be between 110 and 5000.";

        return;

    }



    /* BALANCE CHECK */

    if(amount > balance){

        message.textContent =
            "Insufficient balance.";

        return;

    }



    /*
       SAVE REQUEST
    */

    const history =
        JSON.parse(
            localStorage.getItem(
                "withdraw_history"
            ) || "[]"
        );


    history.unshift({

        number:
            number,

        amount:
            amount,

        date:
            new Date().toLocaleString(),

        status:
            "Pending"

    });


    localStorage.setItem(
        "withdraw_history",
        JSON.stringify(history)
    );



    /*
       UPDATE BALANCE
    */

    const newBalance =
        balance - amount;


    localStorage.setItem(
        "worker_balance",
        newBalance.toFixed(2)
    );



    /* MESSAGE */

    message.textContent =
        "Withdrawal request submitted successfully.";



    /*
       CLEAR INPUT
    */

    document.getElementById(
        "paymentNumber"
    ).value = "";


    document.getElementById(
        "withdrawAmount"
    ).value = "";



    loadProfile();

}



/* INITIAL */

loadProfile();

</script>
