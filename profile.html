<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Profile - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .profile-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }

    .top-ad {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 8px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .profile-header {
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      padding: 15px 16px 18px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 5px 18px rgba(23,105,224,.20);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-back {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.16);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .profile-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .profile-content {
      padding: 16px;
    }

    .profile-card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 6px 20px rgba(25,35,60,.08);
    }

    .profile-user {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .profile-avatar {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      border-radius: 17px;
      background: #eaf2ff;
      color: #1769e0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .profile-user h2 {
      margin: 0 0 4px;
      color: #20283a;
      font-size: 18px;
      font-weight: 800;
      word-break: break-word;
    }

    .profile-user p {
      margin: 0;
      color: #7a8294;
      font-size: 12px;
      word-break: break-word;
    }

    .balance-large {
      margin-top: 18px;
      padding: 17px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      box-shadow: 0 6px 15px rgba(23,105,224,.16);
    }

    .balance-large small {
      display: block;
      opacity: .88;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .balance-large strong {
      font-size: 29px;
      font-weight: 800;
    }

    .section-title {
      margin: 0 0 12px;
      color: #20283a;
      font-size: 17px;
      font-weight: 800;
    }

    .notice {
      margin-bottom: 15px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #30394b;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      min-height: 45px;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      background: #f9fbff;
      color: #20283a;
      font-size: 14px;
      outline: none;
    }

    .form-group input:focus,
    .form-group select:focus {
      border-color: #1769e0;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(23,105,224,.08);
    }

    .profile-btn {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 5px 14px rgba(23,105,224,.18);
    }

    .profile-btn:active {
      transform: scale(.98);
    }

    .logout-btn {
      background: #fff1f1;
      color: #c53b3b;
      box-shadow: none;
      border: 1px solid #ffdada;
    }

    .history-item {
      padding: 13px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .history-item:first-child {
      padding-top: 0;
    }

    .history-item:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .history-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .history-row strong {
      color: #30394b;
      font-size: 13px;
    }

    .history-row span {
      color: #1769e0;
      font-size: 13px;
      font-weight: 800;
    }

    .history-meta {
      margin-top: 5px;
      color: #818898;
      font-size: 11px;
      line-height: 1.5;
    }

    .empty-history {
      color: #818898;
      font-size: 13px;
      margin: 0;
    }

    .fixed-banner {
      position: fixed;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      background: #fff;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 -2px 12px rgba(0,0,0,.12);
    }

    .message {
      display: none;
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
    }

    .message.success {
      display: block;
      background: #eaf8f1;
      color: #14754b;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      color: #b33b3b;
    }

    .native-ad {
      width: 100%;
      min-height: 100px;
      margin: 12px 0;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }
  </style>
</head>

<body>

<div class="profile-page">

  <!-- TOP 320x50 -->
  <div class="top-ad">

    <script>

        'key' : 'b529261b98306ae1169a6bf5b991c3d4',

      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- HEADER -->
  <header class="profile-header">

    <button
      class="profile-back"
      type="button"
      onclick="window.location.href='index.html'">
      ←
    </button>

    <h1>Profile</h1>

  </header>


  <main class="profile-content">


    <!-- USER + BALANCE -->
    <section class="profile-card">

      <div class="profile-user">

        <div class="profile-avatar">
          👤
        </div>

        <div>

          <h2 data-username>
            Guest User
          </h2>

          <p id="profileEmail">
            Not logged in
          </p>

        </div>

      </div>


      <div class="balance-large">

        <small>
          Available Balance
        </small>

        <strong>
          ৳<span data-balance>0.00</span>
        </strong>

      </div>

    </section>


    <!-- WITHDRAW -->
    <section class="profile-card">

      <h3 class="section-title">
        Withdraw Balance
      </h3>

      <div class="notice">
        Minimum withdrawal: ৳510
      </div>


      <div class="form-group">

        <label for="method">
          Payment Method
        </label>

        <select id="method">

          <option value="bKash">
            bKash
          </option>

          <option value="Nagad">
            Nagad
          </option>

        </select>

      </div>


      <div class="form-group">

        <label for="account">
          Account Number
        </label>

        <input
          id="account"
          type="text"
          inputmode="numeric"
          placeholder="Enter payment account number"
        >

      </div>


      <div class="form-group">

        <label for="amount">
          Amount
        </label>

        <input
          id="amount"
          type="number"

          step="0.01"
          placeholder="Enter amount"
        >

      <button
        class="profile-btn"
        type="button"
        onclick="submitWithdraw()">
        Submit Withdraw
      </button>


      <div
        id="withdrawMessage"
        class="message">
      </div>

    </section>


    <!-- NATIVE 2:1 -->

      <script
        async="async"
        data-cfasync="false"
        src="https://pl28546803.profitableratecpmnetwork.com/80507bc8e3d998279cd413247931169e/invoke.js">

    <!-- WITHDRAW HISTORY -->

    <!-- BELOW NATIVE 320x50 -->

        atOptions = {

          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}

      <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

    </div>

  </main>


  <!-- FIXED BOTTOM 320x50 -->
  <div class="fixed-banner">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',

        'height' : 50,
        'width' : 320,
        'params' : {}

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

    </a>

    <a
      href="https://t.me/bitbytee_bot"

      rel="noopener noreferrer">
      <span class="nav-icon">✈</span>
      <span>Telegram</span>
    </a>

    <button onclick="openProfile()">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>

    <button onclick="openMore()">
      <span class="nav-icon">☰</span>
      <span>More</span>
    </button>

  </nav>

</div>


<script src="app.js"></script>


<script>

/* =========================================================
   PROFILE DATA
========================================================= */

function loadProfilePage() {

  const username =
    localStorage.getItem("worker_username") ||
    "Guest User";

  const email =
    localStorage.getItem("worker_email") ||
    "Not logged in";


  document
    .querySelectorAll("[data-username]")
    .forEach(function(el) {

      el.textContent = username;

    });


  document.getElementById(
    "profileEmail"
  ).textContent = email;


  if (
    typeof updateUserDisplays === "function"
  ) {

    updateUserDisplays();

  }

}


/* =========================================================
   WITHDRAW MESSAGE
========================================================= */

function showWithdrawMessage(text, success) {

  const box =
    document.getElementById(
      "withdrawMessage"
    );

  box.style.display = "block";

  box.className =
    success
      ? "message success"
      : "message error";

  box.textContent = text;

}


/* =========================================================
   SUBMIT WITHDRAW
========================================================= */

function submitWithdraw() {

  const method =
    document.getElementById(
      "method"
    ).value;


  const account =
    document.getElementById(
      "account"
    ).value.trim();


  const amount =
    parseFloat(
      document.getElementById(
        "amount"
      ).value
    );


  if (!account) {

    showWithdrawMessage(
      "Please enter your payment account number.",
      false
    );

    return;

  }


  if (!amount || amount < 510) {

    showWithdrawMessage(
      "Minimum withdrawal amount is ৳510.",
      false
    );

    return;

  }


  const balance =
    typeof getBalance === "function"
      ? getBalance()
      : parseFloat(
          localStorage.getItem(
            "worker_balance"
          ) || "0"
        );


  if (amount > balance) {

    showWithdrawMessage(
      "Insufficient balance.",
      false
    );

    return;

  }


  /*
    Local withdrawal record.
    Real payment processing requires
    a secure backend/admin system.
  */

  const withdrawals =
    JSON.parse(
      localStorage.getItem(
        "worker_withdrawals"
      ) || "[]"
    );


  withdrawals.unshift({

    id: Date.now(),

    method: method,

    account:
      account.length > 4
        ? "****" + account.slice(-4)
        : account,

    amount:
      amount.toFixed(2),

    status: "Pending",

    date:
      new Date().toLocaleString()

  });


  localStorage.setItem(
    "worker_withdrawals",
    JSON.stringify(withdrawals)
  );


  if (
    typeof setBalance === "function"
  ) {

    setBalance(
      balance - amount
    );

  }
  else {

    localStorage.setItem(
      "worker_balance",
      (balance - amount).toFixed(2)
    );

  }


  document.getElementById(
    "account"
  ).value = "";


  document.getElementById(
    "amount"
  ).value = "";


  showWithdrawMessage(
    "Withdrawal request submitted successfully.",
    true
  );


  loadWithdrawHistory();

}


/* =========================================================
   WITHDRAW HISTORY
========================================================= */

function loadWithdrawHistory() {

  const box =
    document.getElementById(
      "withdrawHistory"
    );


  const withdrawals =
    JSON.parse(
      localStorage.getItem(
        "worker_withdrawals"
      ) || "[]"
    );


  if (!withdrawals.length) {

    box.innerHTML =
      '<p class="empty-history">' +
      'No withdrawal history yet.' +
      '</p>';

    return;

  }


  box.innerHTML = "";


  withdrawals.forEach(function(item) {

    const div =
      document.createElement(
        "div"
      );


    div.className =
      "history-item";


    div.innerHTML = `

      <div class="history-row">

        <strong>
          ${item.method}
        </strong>

        <span>
          $${item.amount}
        </span>

      </div>

      <div class="history-meta">

        ${item.account}
        ·
        ${item.status}
        ·
        ${item.date}

      </div>

    `;


    box.appendChild(div);

  });

}


/* =========================================================
   LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    loadProfilePage();

    loadWithdrawHistory();

  }
);

</script>

</body>
