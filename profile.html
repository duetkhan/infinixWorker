<script>

/* =========================================================
   FIREBASE-ONLY PROFILE
========================================================= */

let firebaseProfileUser = null;


/* =========================================================
   MESSAGE
========================================================= */

function showWithdrawMessage(text, success) {

  const box =
    document.getElementById("withdrawMessage");

  if (!box) {
    return;
  }

  box.style.display = "block";

  box.className =
    success
      ? "message success"
      : "message error";

  box.textContent = text;

}


/* =========================================================
   USERNAME UI
========================================================= */

function updateProfileUsername(username) {

  const name =
    username || "User";

  document
    .querySelectorAll("[data-username]")
    .forEach(function(element) {

      element.textContent =
        name;

    });

}


/* =========================================================
   BALANCE UI
========================================================= */

function updateProfileBalance(balance) {

  let value =
    Number(balance);

  if (
    !Number.isFinite(value) ||
    value < 0
  ) {

    value = 0;

  }


  document
    .querySelectorAll("[data-balance]")
    .forEach(function(element) {

      element.textContent =
        value.toFixed(2);

    });

}


/* =========================================================
   LOAD FIREBASE PROFILE
========================================================= */

async function loadFirebaseProfile(user) {

  if (
    !user ||
    !user.uid
  ) {

    return;

  }


  firebaseProfileUser =
    user;


  const emailElement =
    document.getElementById(
      "profileEmail"
    );


  if (emailElement) {

    emailElement.textContent =
      user.email || "";

  }


  let username =
    "User";


  /* ---------------------------------------------------------
     LOAD PROFILE
  --------------------------------------------------------- */

  try {

    const profileSnap =
      await firebaseDb
        .collection("profiles")
        .doc(user.uid)
        .get();


    if (
      profileSnap.exists
    ) {

      const profileData =
        profileSnap.data() || {};


      if (
        profileData.username
      ) {

        username =
          String(
            profileData.username
          );

      }

    }

  } catch (error) {

    console.error(
      "Firebase profile read error:",
      error
    );


    showWithdrawMessage(
      "Unable to load your profile. Please refresh and try again.",
      false
    );

  }


  updateProfileUsername(
    username
  );


  /* ---------------------------------------------------------
     LOAD WALLET
  --------------------------------------------------------- */

  let balance =
    0;


  try {

    const walletSnap =
      await firebaseDb
        .collection("wallets")
        .doc(user.uid)
        .get();


    if (
      walletSnap.exists
    ) {

      const walletData =
        walletSnap.data() || {};


      const walletBalance =
        Number(
          walletData.balance
        );


      if (
        Number.isFinite(
          walletBalance
        )
      ) {

        balance =
          Math.max(
            0,
            walletBalance
          );

      }

    }

  } catch (error) {

    console.error(
      "Firebase wallet read error:",
      error
    );


    showWithdrawMessage(
      "Unable to load your balance. Please refresh and try again.",
      false
    );

  }


  updateProfileBalance(
    balance
  );

}


/* =========================================================
   FIREBASE AUTH STATE
========================================================= */

function initFirebaseProfile() {

  if (
    typeof firebaseAuth ===
      "undefined" ||
    typeof firebaseDb ===
      "undefined"
  ) {

    console.error(
      "Firebase services are not available."
    );


    window.location.replace(
      "login.html"
    );

    return;

  }


  firebaseAuth.onAuthStateChanged(
    async function(user) {

      if (!user) {

        firebaseProfileUser =
          null;

        window.location.replace(
          "login.html"
        );

        return;

      }


      await loadFirebaseProfile(
        user
      );


      await loadWithdrawHistory();

    }
  );

}


/* =========================================================
   FIREBASE WITHDRAWAL HISTORY
========================================================= */

async function loadWithdrawHistory() {

  const box =
    document.getElementById(
      "withdrawHistory"
    );


  if (!box) {
    return;
  }


  const user =
    firebaseProfileUser ||
    firebaseAuth.currentUser;


  if (!user) {

    box.innerHTML =
      '<p class="empty-history">' +
      'No withdrawal history yet.' +
      '</p>';

    return;

  }


  try {

    const snapshot =
      await firebaseDb
        .collection("withdrawals")
        .where(
          "userId",
          "==",
          user.uid
        )
        .get();


    const withdrawals =
      [];


    snapshot.forEach(
      function(doc) {

        const data =
          doc.data() || {};


        withdrawals.push({

          id:
            doc.id,

          method:
            data.method ||
            "Payment",

          account:
            data.account ||
            data.accountNumber ||
            "",

          amount:
            Number(
              data.amount || 0
            ),

          status:
            data.status ||
            "Pending",

          createdAt:
            data.createdAt ||
            data.date ||
            null

        });

      }
    );


    withdrawals.sort(
      function(a, b) {

        const aTime =
          a.createdAt &&
          a.createdAt.toMillis
            ? a.createdAt.toMillis()
            : (
                a.createdAt
                  ? new Date(
                      a.createdAt
                    ).getTime()
                  : 0
              );


        const bTime =
          b.createdAt &&
          b.createdAt.toMillis
            ? b.createdAt.toMillis()
            : (
                b.createdAt
                  ? new Date(
                      b.createdAt
                    ).getTime()
                  : 0
              );


        return bTime - aTime;

      }
    );


    if (
      !withdrawals.length
    ) {

      box.innerHTML =
        '<p class="empty-history">' +
        'No withdrawal history yet.' +
        '</p>';

      return;

    }


    box.innerHTML =
      "";


    withdrawals.forEach(
      function(item) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "history-item";


        let dateText =
          "";


        if (
          item.createdAt &&
          item.createdAt.toDate
        ) {

          dateText =
            item.createdAt
              .toDate()
              .toLocaleString();

        } else if (
          item.createdAt
        ) {

          const parsed =
            new Date(
              item.createdAt
            );


          dateText =
            Number.isNaN(
              parsed.getTime()
            )
              ? String(
                  item.createdAt
                )
              : parsed.toLocaleString();

        }


        const amountText =
          Number.isFinite(
            item.amount
          )
            ? item.amount.toFixed(2)
            : "0.00";


        div.innerHTML = `

          <div class="history-row">

            <strong>
              ${escapeHtmlSafe(item.method)}
            </strong>

            <span>
              ৳${escapeHtmlSafe(amountText)}
            </span>

          </div>

          <div class="history-meta">

            ${escapeHtmlSafe(item.account)}

            ·

            ${escapeHtmlSafe(item.status)}

            ${
              dateText
                ? "· " +
                  escapeHtmlSafe(
                    dateText
                  )
                : ""
            }

          </div>

        `;


        box.appendChild(
          div
        );

      }
    );

  } catch (error) {

    console.error(
      "Firebase withdrawal history error:",
      error
    );


    box.innerHTML =
      '<p class="empty-history">' +
      'Unable to load withdrawal history.' +
      '</p>';

  }

}


/* =========================================================
   SAFE HTML
========================================================= */

function escapeHtmlSafe(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   REQUEST WITHDRAW
   ---------------------------------------------------------
   The actual withdrawal form is handled on withdraw.html.
========================================================= */

function openWithdrawPage() {

  const user =
    firebaseProfileUser ||
    firebaseAuth.currentUser;


  if (!user) {

    window.location.replace(
      "login.html"
    );

    return;

  }


  window.location.href =
    "withdraw.html";

}


/* =========================================================
   FIREBASE LOGOUT
========================================================= */

async function logout() {

  const logoutButton =
    document.querySelector(
      ".logout-btn"
    );


  if (logoutButton) {

    logoutButton.disabled =
      true;

    logoutButton.textContent =
      "Logging out...";

  }


  try {

    await firebaseAuth.signOut();


    /*
      Firebase is now the only
      authentication source.
    */

    window.location.replace(
      "login.html"
    );

  } catch (error) {

    console.error(
      "Firebase logout error:",
      error
    );


    if (logoutButton) {

      logoutButton.disabled =
        false;

      logoutButton.textContent =
        "Logout";

    }


    showWithdrawMessage(
      "Logout failed. Please try again.",
      false
    );

  }

}


/* =========================================================
   PAGE LOAD
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    initFirebaseProfile();

  }
);

</script>
