      justify-content: center;

    }

    .signup-header {

      color: #fff;
      padding: 20px 16px 22px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 5px 18px rgba(23,105,224,.20);
      text-align: center;
    }

    .signup-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 10px;
      border-radius: 17px;
      background: rgba(255,255,255,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
    }

    .signup-header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .signup-header p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: .9;
    }

    .signup-content {
      padding: 16px;
    }

    .signup-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px 17px;
      box-shadow: 0 6px 20px rgba(25,35,60,.08);
    }

    .signup-card h2 {
      margin: 0 0 6px;
      color: #20283a;
      text-align: center;
      font-size: 22px;
    }

    .signup-subtitle {
      margin: 0 0 20px;
      color: #7a8394;
      text-align: center;
      font-size: 13px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #30394b;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      box-sizing: border-box;
      min-height: 46px;
      padding: 12px 13px;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      background: #f9fbff;
      color: #20283a;
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: #1769e0;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(23,105,224,.08);
    }

    .signup-btn {
      width: 100%;
      min-height: 47px;
      border: 0;
      border-radius: 13px;
      margin-top: 4px;
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(23,105,224,.20);
    }

    .signup-btn:active {
      transform: scale(.98);
    }

    .signup-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .signup-message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .signup-message.error {
      display: block;
      background: #fff0f0;
      color: #b33b3b;
    }

    .signup-message.success {
      display: block;
      background: #eaf8f1;
      color: #14754b;
    }

    .login-link {
      margin-top: 17px;
      text-align: center;
      color: #7a8394;
      font-size: 13px;
    }

    .login-link a {
      color: #1769e0;
      font-weight: 800;
      text-decoration: none;
    }

    .native-ad {
      width: 100%;
      min-height: 100px;
      margin: 12px 0;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }

    .bottom-banner {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- TOP 320x50 AD -->
  <div class="top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',

        'height' : 50,

      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- HEADER -->
  <header class="signup-header">

    <div class="signup-logo">
      IW
    </div>

    <h1>Infinix Worker</h1>

    <p>Fast • Simple • Smart Earning Platform</p>

  </header>


  <main class="signup-content">

    <!-- SIGNUP CARD -->
    <div class="signup-card">

      <h2>Create Account</h2>

      <p class="signup-subtitle">
        Create your Infinix Worker account
      </p>


      <form id="signupForm">

        <!-- USERNAME -->
        <div class="field">

          <label for="signupUsername">
            Username
          </label>

          <input
            type="text"
            id="signupUsername"
            placeholder="Choose a username"
            minlength="3"
            maxlength="30"
            autocomplete="username"
            required
          >

        </div>


        <!-- EMAIL -->
        <div class="field">

          <label for="signupEmail">
            Email
          </label>

          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="field">

          <label for="signupPassword">
            Password
          </label>

          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          class="signup-btn"
          id="signupBtn"
        >
          Create Account
        </button>

      </form>


      <div
        id="signupMessage"
        class="signup-message"
      ></div>


      <div class="login-link">

      <script>
        atOptions = {

<script>

const USER_KEY =
  "iw_device_user";

const LOGIN_KEY =
  "worker_logged_in";


function showSignupMessage(text, type) {

  const box =
    document.getElementById("signupMessage");

  box.textContent = text;

  box.className =
    "signup-message " + type;

}


/* =========================================================
   CHECK EXISTING ACCOUNT / LOGIN
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const existingUser =
      localStorage.getItem(USER_KEY);

    const loggedIn =
      localStorage.getItem(LOGIN_KEY);


    /* Already logged in → Home */

    if (loggedIn === "true") {

      window.location.href =
        "index.html";

      return;

    }


    /*
      Device already has an account.
      Block creating another account.
    */

    if (existingUser) {

      document
        .getElementById("signupBtn")
        .disabled = true;


      showSignupMessage(
        "An account is already registered on this device. Please login with the existing account.",
        "error"
      );

    }

  }
);


/* =========================================================
   SIGNUP
========================================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      /*
        Double-check device restriction.
      */

      if (
        localStorage.getItem(USER_KEY)
      ) {

        showSignupMessage(
          "Only one account is allowed on this device.",
          "error"
        );

        return;

      }


      const username =
        document
          .getElementById(
            "signupUsername"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "signupEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "signupPassword"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      if (username.length < 3) {

        showSignupMessage(
          "Username must be at least 3 characters.",
          "error"
        );

        return;

      }


      if (password.length < 6) {

        showSignupMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }


      if (
        password !== confirmPassword
      ) {

        showSignupMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      /*
        Create local device account.
      */

      const user = {

        username: username,

        email: email,

        password: password,

        createdAt:
          new Date().toISOString()

      };


      /*
        Save the single device account.
      */

      localStorage.setItem(
        USER_KEY,
        JSON.stringify(user)
      );


      localStorage.setItem(
        "worker_username",
        username
      );


      localStorage.setItem(
        "worker_email",
        email
      );


      /*
        Automatic login
      */

      localStorage.setItem(
        LOGIN_KEY,
        "true"
      );


      /*
        Initial balance
      */

      if (
        !localStorage.getItem(
          "worker_balance"
        )
      ) {

        localStorage.setItem(
          "worker_balance",
          "0.00"
        );

      }


      showSignupMessage(
        "Account created successfully. Redirecting...",
        "success"
      );


      /*
        Redirect to Home
      */

      setTimeout(
        function() {

          window.location.href =
            "index.html";

        },
        900
      );

    }
  );

</script>
