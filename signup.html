<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign Up - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    .signup-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }

    .top-ad {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 8px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .signup-header {
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      padding: 20px 16px 22px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 5px 18px rgba(23,105,224,.20);
      text-align: center;
    }

    .signup-logo {
      width: 54px;
      height: 54px;
      margin: 0 auto 10px;
      border-radius: 17px;
      background: rgba(255,255,255,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
    }

    .signup-header h1 {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .signup-header p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: .9;
    }

    .signup-content {
      padding: 16px;
    }

    .signup-card {
      background: #fff;
      border-radius: 20px;
      padding: 20px 17px;
      box-shadow: 0 6px 20px rgba(25,35,60,.08);
    }

    .signup-card h2 {
      margin: 0 0 6px;
      color: #20283a;
      text-align: center;
      font-size: 22px;
    }

    .signup-subtitle {
      margin: 0 0 20px;
      color: #7a8394;
      text-align: center;
      font-size: 13px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #30394b;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      box-sizing: border-box;
      min-height: 46px;
      padding: 12px 13px;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      background: #f9fbff;
      color: #20283a;
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: #1769e0;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(23,105,224,.08);
    }

    .signup-btn {
      width: 100%;
      min-height: 47px;
      border: 0;
      border-radius: 13px;
      margin-top: 4px;
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(23,105,224,.20);
    }

    .signup-btn:active {
      transform: scale(.98);
    }

    .signup-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .signup-message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
    }

    .signup-message.error {
      display: block;
      background: #fff0f0;
      color: #b33b3b;
    }

    .signup-message.success {
      display: block;
      background: #eaf8f1;
      color: #14754b;
    }

    .login-link {
      margin-top: 17px;
      text-align: center;
      color: #7a8394;
      font-size: 13px;
    }

    .login-link a {
      color: #1769e0;
      font-weight: 800;
      text-decoration: none;
    }

    .native-ad {
      width: 100%;
      min-height: 100px;
      margin: 12px 0;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }

    .bottom-banner {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>

<body>

<div class="signup-page">

  <!-- TOP 320x50 AD -->
  <div class="top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- HEADER -->
  <header class="signup-header">

    <div class="signup-logo">
      IW
    </div>

    <h1>Infinix Worker</h1>

    <p>Fast • Simple • Smart Earning Platform</p>

  </header>


  <main class="signup-content">

    <!-- SIGNUP CARD -->
    <div class="signup-card">

      <h2>Create Account</h2>

      <p class="signup-subtitle">
        Create your Infinix Worker account
      </p>


      <form id="signupForm">

        <!-- USERNAME -->
        <div class="field">

          <label for="signupUsername">
            Username
          </label>

          <input
            type="text"
            id="signupUsername"
            placeholder="Choose a username"
            minlength="3"
            maxlength="30"
            autocomplete="username"
            required
          >

        </div>


        <!-- EMAIL -->
        <div class="field">

          <label for="signupEmail">
            Email
          </label>

          <input
            type="email"
            id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >

        </div>


        <!-- PASSWORD -->
        <div class="field">

          <label for="signupPassword">
            Password
          </label>

          <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <!-- CONFIRM PASSWORD -->
        <div class="field">

          <label for="confirmPassword">
            Confirm Password
          </label>

          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm your password"
            minlength="6"
            autocomplete="new-password"
            required
          >

        </div>


        <button
          type="submit"
          class="signup-btn"
          id="signupBtn">
          Create Account
        </button>

      </form>


      <div
        id="signupMessage"
        class="signup-message">
      </div>


      <div class="login-link">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </div>


    <!-- NATIVE 2:1 -->
    <div class="native-ad">

      <script
        async="async"
        data-cfasync="false"
        src="https://pl28546803.profitableratecpmnetwork.com/80507bc8e3d998279cd413247931169e/invoke.js">
      </script>

      <div id="container-80507bc8e3d998279cd413247931169e"></div>

    </div>


    <!-- BELOW NATIVE 320x50 -->
    <div class="bottom-banner">

      <script>
        atOptions = {
          'key' : 'b529261b98306ae1169a6bf5b991c3d4',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>

      <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

    </div>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html" class="nav-item">
      <span>⌂</span>
      <small>Home</small>
    </a>

    <a
      href="https://lsr-video-downloaders.vercel.app/"
      class="nav-item">
      <span>🌐</span>
      <small>Website</small>
    </a>

    <a
      href="https://t.me/bitbytee_bot"
      class="nav-item"
      target="_blank"
      rel="noopener noreferrer">
      <span>✈</span>
      <small>Telegram</small>
    </a>

    <a
      href="profile.html"
      class="nav-item">
      <span>👤</span>
      <small>Profile</small>
    </a>

    <a
      href="more.html"
      class="nav-item">
      <span>☰</span>
      <small>More</small>
    </a>

  </nav>

</div>


<script>

const USER_KEY =
  "iw_device_user";

const LOGIN_KEY =
  "worker_logged_in";


/* =========================================================
   MESSAGE
========================================================= */

function showSignupMessage(text, type) {

  const box =
    document.getElementById("signupMessage");

  box.textContent = text;

  box.className =
    "signup-message " + type;

}


/* =========================================================
   CHECK DEVICE ACCOUNT
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const existingUser =
      localStorage.getItem(USER_KEY);

    const loggedIn =
      localStorage.getItem(LOGIN_KEY);


    /*
      If already logged in,
      go to Home.
    */

    if (loggedIn === "true") {

      window.location.href =
        "index.html";

      return;

    }


    /*
      One-device rule.

      If this browser already has a registered
      Infinix Worker account, do not create
      another account here.
    */

    if (existingUser) {

      const signupBtn =
        document.getElementById(
          "signupBtn"
        );

      signupBtn.disabled = true;


      showSignupMessage(
        "An account is already registered on this device. Please login with the existing account.",
        "error"
      );

    }

  }
);


/* =========================================================
   FIREBASE SIGNUP
========================================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      /*
        Device account check
      */

      if (
        localStorage.getItem(USER_KEY)
      ) {

        showSignupMessage(
          "Only one account is allowed on this device.",
          "error"
        );

        return;

      }


      const username =
        document
          .getElementById(
            "signupUsername"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "signupEmail"
          )
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById(
            "signupPassword"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirmPassword"
          )
          .value;


      const signupBtn =
        document.getElementById(
          "signupBtn"
        );


      /* =====================================================
         VALIDATION
      ===================================================== */

      if (username.length < 3) {

        showSignupMessage(
          "Username must be at least 3 characters.",
          "error"
        );

        return;

      }


      if (username.length > 30) {

        showSignupMessage(
          "Username must be 30 characters or less.",
          "error"
        );

        return;

      }


      if (password.length < 6) {

        showSignupMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }


      if (
        password !== confirmPassword
      ) {

        showSignupMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      signupBtn.disabled = true;

      signupBtn.textContent =
        "Creating account...";


      try {

        /* ===================================================
           CREATE FIREBASE AUTH USER
        =================================================== */

        const result =
          await firebaseAuth
            .createUserWithEmailAndPassword(
              email,
              password
            );


        const firebaseUser =
          result.user;


        /* ===================================================
           CREATE FIRESTORE PROFILE
        =================================================== */

        await firebaseDb
          .collection("profiles")
          .doc(firebaseUser.uid)
          .set({

            username: username,

            email: email,

            balance: 0,

            createdAt:
              firebase.firestore.FieldValue
                .serverTimestamp()

          });


        /* ===================================================
           LOCAL COMPATIBILITY SESSION

           IMPORTANT:
           Password is NOT stored.
        =================================================== */

        const deviceUser = {

          username: username,

          email: email,

          firebaseUid:
            firebaseUser.uid,

          createdAt:
            new Date().toISOString()

        };


        localStorage.setItem(
          USER_KEY,
          JSON.stringify(deviceUser)
        );


        localStorage.setItem(
          "worker_username",
          username
        );


        localStorage.setItem(
          "worker_email",
          email
        );


        localStorage.setItem(
          "worker_balance",
          "0.00"
        );


        localStorage.setItem(
          LOGIN_KEY,
          "true"
        );


        /* ===================================================
           SUCCESS
        =================================================== */

        showSignupMessage(
          "Account created successfully. Redirecting...",
          "success"
        );


        setTimeout(
          function() {

            window.location.href =
              "index.html";

          },
          900
        );


      } catch (error) {

        console.error(
          "Firebase signup error:",
          error
        );


        /*
          If Firebase account was created but
          Firestore profile failed, sign the user
          out instead of leaving a half-completed
          local session.
        */

        try {

          await firebaseAuth.signOut();

        } catch (signOutError) {

          console.log(
            "Sign-out cleanup warning:",
            signOutError
          );

        }


        let message =
          "Account creation failed. Please try again.";


        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          message =
            "This email is already registered. Please login instead.";

        }
        else if (
          error.code ===
          "auth/invalid-email"
        ) {

          message =
            "Please enter a valid email address.";

        }
        else if (
          error.code ===
          "auth/weak-password"
        ) {

          message =
            "Password is too weak. Use at least 6 characters.";

        }
        else if (
          error.code ===
          "auth/operation-not-allowed"
        ) {

          message =
            "Email/Password authentication is not enabled in Firebase.";

        }
        else if (
          error.code ===
          "auth/network-request-failed"
        ) {

          message =
            "Network error. Please check your internet connection.";

        }
        else if (
          error.code ===
          "permission-denied"
        ) {

          message =
            "Firestore permission denied. Please check Firebase rules.";

        }


        showSignupMessage(
          message,
          "error"
        );


        signupBtn.disabled = false;

        signupBtn.textContent =
          "Create Account";

      }

    }
  );

</script>

</body>
</html>
