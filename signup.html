<script>

/* =========================================================
   FIREBASE-ONLY SIGNUP
   =========================================================
   Important:
   - No old localStorage account is used.
   - No password is stored in localStorage.
   - Firebase Authentication is the only authentication source.
   - New user profile is stored in Firestore.
   - New wallet is stored in Firestore.
========================================================= */


/* =========================================================
   MESSAGE
========================================================= */

function showSignupMessage(text, type) {

  const box =
    document.getElementById("signupMessage");

  box.textContent = text;

  box.className =
    "signup-message " + type;

}


/* =========================================================
   FIREBASE ERROR MESSAGE
========================================================= */

function getSignupErrorMessage(error) {

  if (!error) {
    return "Account creation failed. Please try again.";
  }


  const code =
    error.code || "";


  switch (code) {

    case "auth/email-already-in-use":
      return "This email is already registered. Please login instead.";

    case "auth/invalid-email":
      return "Please enter a valid email address.";

    case "auth/weak-password":
      return "Password is too weak. Use at least 6 characters.";

    case "auth/operation-not-allowed":
      return "Email/Password authentication is not enabled in Firebase.";

    case "auth/network-request-failed":
      return "Network error. Please check your internet connection.";

    case "auth/too-many-requests":
      return "Too many attempts. Please wait and try again.";

    case "auth/unauthorized-domain":
      return "This website domain is not authorized in Firebase Authentication.";

    case "auth/internal-error":
      return "Firebase internal error. Please try again.";

    case "permission-denied":
      return "Firestore permission denied. Please check Firebase rules.";

    default:
      return "Account creation failed. Please try again.";

  }

}


/* =========================================================
   FIRESTORE PROFILE + WALLET
========================================================= */

async function createFirebaseUserData(
  user,
  username,
  email
) {

  if (!user || !user.uid) {
    throw new Error("Firebase user is missing.");
  }


  const uid =
    user.uid;


  const profileRef =
    firebaseDb
      .collection("profiles")
      .doc(uid);


  const walletRef =
    firebaseDb
      .collection("wallets")
      .doc(uid);


  const batch =
    firebaseDb.batch();


  batch.set(
    profileRef,
    {
      username: username,
      email: email,
      balance: 0,
      role: "user",
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()
    },
    {
      merge: false
    }
  );


  batch.set(
    walletRef,
    {
      balance: 0,
      pending_balance: 0,
      total_earned: 0,
      total_withdrawn: 0,
      userId: uid,
      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()
    },
    {
      merge: false
    }
  );


  await batch.commit();

}


/* =========================================================
   PREVENT DUPLICATE SUBMISSION
========================================================= */

let signupProcessing =
  false;


/* =========================================================
   SIGNUP
========================================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      if (signupProcessing) {
        return;
      }


      const username =
        document
          .getElementById("signupUsername")
          .value
          .trim();


      const email =
        document
          .getElementById("signupEmail")
          .value
          .trim()
          .toLowerCase();


      const password =
        document
          .getElementById("signupPassword")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      const signupBtn =
        document.getElementById("signupBtn");


      /* =====================================================
         VALIDATION
      ===================================================== */

      if (username.length < 3) {

        showSignupMessage(
          "Username must be at least 3 characters.",
          "error"
        );

        return;

      }


      if (username.length > 30) {

        showSignupMessage(
          "Username must be 30 characters or less.",
          "error"
        );

        return;

      }


      /*
        Keep username simple and safe for Firestore/UI.
      */

      const usernamePattern =
        /^[a-zA-Z0-9_.-]+$/;


      if (!usernamePattern.test(username)) {

        showSignupMessage(
          "Username can contain only letters, numbers, dot, underscore and hyphen.",
          "error"
        );

        return;

      }


      if (password.length < 6) {

        showSignupMessage(
          "Password must be at least 6 characters.",
          "error"
        );

        return;

      }


      if (password !== confirmPassword) {

        showSignupMessage(
          "Passwords do not match.",
          "error"
        );

        return;

      }


      if (!firebaseAuth) {

        showSignupMessage(
          "Firebase Authentication is not available. Please refresh the page.",
          "error"
        );

        return;

      }


      if (!firebaseDb) {

        showSignupMessage(
          "Firebase Firestore is not available. Please refresh the page.",
          "error"
        );

        return;

      }


      signupProcessing =
        true;


      signupBtn.disabled =
        true;


      signupBtn.textContent =
        "Creating account...";


      let firebaseUser =
        null;


      try {

        /* ===================================================
           STEP 1
           CREATE FIREBASE AUTH ACCOUNT
        =================================================== */

        const result =
          await firebaseAuth
            .createUserWithEmailAndPassword(
              email,
              password
            );


        firebaseUser =
          result.user;


        if (
          !firebaseUser ||
          !firebaseUser.uid
        ) {

          throw new Error(
            "Firebase account was not created correctly."
          );

        }


        /* ===================================================
           STEP 2
           CREATE PROFILE + WALLET
        =================================================== */

        try {

          await createFirebaseUserData(
            firebaseUser,
            username,
            email
          );

        } catch (firestoreError) {

          console.error(
            "Firestore user data error:",
            firestoreError
          );


          /*
            Auth account already exists.
            Sign out so user does not enter
            the app without profile/wallet.
          */

          try {

            await firebaseAuth.signOut();

          } catch (signOutError) {

            console.error(
              "Firebase cleanup sign-out error:",
              signOutError
            );

          }


          throw firestoreError;

        }


        /* ===================================================
           IMPORTANT
           NO LOCALSTORAGE AUTH SESSION
        =================================================== */

        /*
          Firebase Auth automatically maintains
          the authenticated session.

          We intentionally DO NOT save:
          - password
          - worker_logged_in
          - worker_username
          - worker_email
          - worker_balance
          - iw_device_user
        */


        showSignupMessage(
          "Account created successfully. Redirecting...",
          "success"
        );


        /*
          Give Firebase a moment to finish its
          authentication state propagation.
        */

        setTimeout(
          function() {

            window.location.href =
              "index.html";

          },
          700
        );


      } catch (error) {

        console.error(
          "Firebase signup error:",
          error
        );


        const message =
          getSignupErrorMessage(error);


        showSignupMessage(
          message,
          "error"
        );


        signupProcessing =
          false;


        signupBtn.disabled =
          false;


        signupBtn.textContent =
          "Create Account";

      }

    }
  );


/* =========================================================
   IF ALREADY LOGGED IN
   =========================================================
   Firebase session only.
========================================================= */

firebaseAuth.onAuthStateChanged(
  function(user) {

    if (user) {

      /*
        If a Firebase user is already logged in,
        there is no reason to create another account
        from this page.
      */

      window.location.href =
        "index.html";

    }

  }
);

</script>
