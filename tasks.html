<script>

const tasks = [

    {
        id: 1,

        title:
        "Daily Web Activity",

        reward:
        2,

        description:
        "Visit the Web service and complete the required activity.",

        url:
        "https://lsr-video-downloaders.vercel.app/"
    },


    {
        id: 2,

        title:
        "Telegram Activity",

        reward:
        1,

        description:
        "Open the Telegram bot and complete the requested activity.",

        url:
        "https://t.me/bitbytee_bot"
    }

];


function renderTasks(){

    const container =
        document.getElementById(
            "taskList"
        );


    container.innerHTML =
        tasks.map(function(task){

            return `

            <article class="task-row">

                <div class="task-row-icon">
                    ✓
                </div>


                <div class="task-info">

                    <h3>
                        ${task.title}
                    </h3>

                    <p>
                        ${task.description}
                    </p>

                    <b>
                        +${task.reward.toFixed(2)}
                        coins
                    </b>

                </div>


                <button
                    onclick="beginTask(${task.id})">

                    Start

                </button>

            </article>

            `;

        }).join("");

}


function beginTask(id){

    const task =
        tasks.find(function(item){

            return item.id === id;

        });


    if(!task){
        return;
    }


    window.open(
        task.url,
        "_blank"
    );


    /*
       Activity timer.

       Reward should only be granted
       after a genuine activity.
    */

    let seconds = 30;


    const timer =
        setInterval(function(){

            seconds--;


            if(seconds <= 0){

                clearInterval(timer);


                const completed =
                    confirm(
                        "Did you genuinely complete the required activity?"
                    );


                if(completed){

                    const currentBalance =
                        Number(
                            localStorage.getItem(
                                "worker_balance"
                            ) || 0
                        );


                    const newBalance =
                        currentBalance +
                        task.reward;


                    localStorage.setItem(
                        "worker_balance",
                        newBalance.toFixed(2)
                    );


                    alert(
                        "Task completed. Reward added."
                    );

                }

            }

        },1000);

}


renderTasks();

</script>
