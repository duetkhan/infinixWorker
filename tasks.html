<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#2563eb">

  <title>Tasks - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="app">

    <!-- Header -->
    <header class="app-header">

      <div class="brand">

        <button
          onclick="history.back()"
          style="
            width:36px;
            height:36px;
            border-radius:10px;
            background:#eef4ff;
            font-size:18px;
          "
        >
          ←
        </button>

        <div>
          <h1>Tasks</h1>
          <span>Available earning tasks</span>
        </div>

      </div>

    </header>


    <!-- Content -->
    <main class="main-content">

      <section class="welcome-section">
        <h2>Available Tasks</h2>
        <p>Complete tasks and earn coins.</p>
      </section>


      <!-- Task 1 -->
      <div class="task-box">

        <div class="task-icon">
          ⚡
        </div>

        <div class="task-content">

          <h3>Daily Task</h3>

          <p>
            Complete the task to receive your reward.
          </p>

          <div class="task-bottom">

            <span class="task-reward">
              +10 Coins
            </span>

            <button
              class="task-button"
              onclick="startTask()"
            >
              Start
            </button>

          </div>

        </div>

      </div>


      <!-- Native Advertisement -->
      <section class="native-ad">

        <div class="ad-label">
          Advertisement
        </div>

        <div id="native-ad-container"></div>

      </section>


      <!-- Banner Advertisement -->
      <section class="banner-ad">

        <div class="ad-label">
          Advertisement
        </div>

        <div id="banner-ad-container"></div>

      </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

      <button
        class="nav-item"
        onclick="window.location.href='index.html'"
      >
        <span>⌂</span>
        <small>Home</small>
      </button>

      <button class="nav-item active">
        <span>⚡</span>
        <small>Work</small>
      </button>

      <button
        class="nav-item"
        onclick="window.location.href='index.html'"
      >
        <span>▶</span>
        <small>Ads</small>
      </button>

      <button
        class="nav-item"
        onclick="window.location.href='withdraw.html'"
      >
        <span>💳</span>
        <small>Withdraw</small>
      </button>

      <button
        class="nav-item"
        onclick="window.location.href='profile.html'"
      >
        <span>👤</span>
        <small>Profile</small>
      </button>

    </nav>

  </div>


  <script src="app.js"></script>

  <script>
    function startTask() {

      if (typeof openSmartlink === "function") {
        openSmartlink();
      }

      alert(
        "Task started. Complete the task to receive your reward."
      );
    }
  </script>

</body>
</html>
