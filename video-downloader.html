<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Video Downloader - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .downloader-page {
      min-height: 100vh;
      padding-bottom: 145px;
    }

    .download-box {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 5px 18px rgba(25,35,60,.07);
      margin-bottom: 15px;
    }

    .download-box h2 {
      font-size: 19px;
      margin-bottom: 8px;
    }

    .download-box p {
      color: #737b8d;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    .url-input {
      width: 100%;
      height: 48px;
      border: 1px solid #dfe3ec;
      border-radius: 13px;
      padding: 0 13px;
      font-size: 14px;
      outline: none;
      margin-bottom: 10px;
    }

    .url-input:focus {
      border-color: #5b3df5;
    }

    .download-result {
      margin-top: 15px;
      display: none;
    }

    .download-result a {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      background: #168f5b;
      color: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .supported {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .supported div {
      background: #f5f3ff;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      color: #5b3df5;
      font-size: 13px;
      font-weight: 700;
    }

    .fixed-banner {
      position: fixed;
      left: 50%;
      bottom: 68px;
      transform: translateX(-50%);
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      background: #fff;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 -2px 12px rgba(0,0,0,.12);
    }
  </style>
</head>

<body>

<div id="app" class="downloader-page">

  <!-- TOP BANNER -->
  <div class="ad-area top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- SOCIAL BAR -->
  <div class="social-bar">

    <script src="https://pl31263667.profitableratecpmnetwork.com/b0/c5/21/b0c5218558b6cd7043e11407e07289b1.js"></script>

  </div>


  <!-- HEADER -->
  <div class="page-header">

    <button
      class="back-btn"
      onclick="window.location.href='index.html'">
      ←
    </button>

    <h1>Video Downloader</h1>

  </div>


  <main class="page-content">

    <div class="download-box">

      <h2>Download Video</h2>

      <p>
        Paste a supported video URL below and continue.
      </p>

      <input
        id="videoUrl"
        class="url-input"
        type="url"
        placeholder="Paste video URL here"
        autocomplete="off"
      >

      <button
        class="btn"
        type="button"
        onclick="startDownload()">
        Download
      </button>


      <div
        id="downloadMessage"
        style="
          display:none;
          margin-top:12px;
        ">
      </div>


      <div
        id="downloadResult"
        class="download-result">

        <a
          id="downloadLink"
          href="#"
          target="_blank"
          rel="noopener noreferrer">
          Download Video
        </a>

      </div>

    </div>


    <!-- SUPPORTED -->
    <div class="card">

      <h3>Supported Platforms</h3>

      <div class="supported">

        <div>▶ YouTube</div>
        <div>🎵 TikTok</div>
        <div>📘 Facebook</div>
        <div>📸 Instagram</div>

      </div>

    </div>


    <div class="notice">

      Only download content that you have permission to
      download and use.

    </div>

  </main>


  <!-- FIXED 320x50 BANNER -->
  <div class="fixed-banner">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>

    <a href="https://lsr-video-downloaders.vercel.app/">
      <span class="nav-icon">🌐</span>
      <span>Website</span>
    </a>

    <a
      href="https://t.me/bitbytee_bot"
      target="_blank"
      rel="noopener noreferrer">
      <span class="nav-icon">✈</span>
      <span>Telegram</span>
    </a>

    <button onclick="openProfile()">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>

    <button onclick="openMore()">
      <span class="nav-icon">☰</span>
      <span>More</span>
    </button>

  </nav>

</div>


<script src="app.js"></script>


<script>

function showDownloadMessage(text, type) {

  const box =
    document.getElementById("downloadMessage");

  box.style.display = "block";

  box.className =
    type === "success"
      ? "success-message"
      : "error-message";

  box.textContent = text;
}


function startDownload() {

  const input =
    document.getElementById("videoUrl");

  const url =
    input.value.trim();


  if (!url) {

    showDownloadMessage(
      "Please enter a video URL.",
      "error"
    );

    return;
  }


  /*
    Smartlink is only an advertising/navigation action.
    It is not required to click the advertisement.
  */

  if (typeof openSmartlink === "function") {
    openSmartlink();
  }


  /*
    Downloader backend is not connected yet.
    This keeps the interface ready without pretending
    that a client-side HTML page can download every
    external platform's video by itself.
  */

  showDownloadMessage(
    "Downloader service is ready. Connect your video-download API/backend to generate the download link.",
    "error"
  );

}

</script>

</body>
</html>
