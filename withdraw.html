<!-- =========================================================
     FIREBASE
========================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


<script>

/* =========================================================
   FIREBASE REFERENCES
========================================================= */

let currentFirebaseUser = null;
let firebaseAuthReady = false;
let withdrawSubmitting = false;


/* =========================================================
   HELPERS
========================================================= */

function escapeHtmlSafe(value) {

  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function formatDate(timestamp) {

  try {

    if (!timestamp) {
      return "Date unavailable";
    }

    let date;

    if (
      timestamp &&
      typeof timestamp.toDate === "function"
    ) {

      date = timestamp.toDate();

    } else {

      date = new Date(timestamp);

    }

    if (isNaN(date.getTime())) {
      return "Date unavailable";
    }

    return date.toLocaleString();

  } catch (error) {

    return "Date unavailable";

  }

}


function maskPaymentNumber(value) {

  const text = String(value || "").trim();

  if (text.length <= 4) {
    return text;
  }

  return "••••" + text.slice(-4);

}


/* =========================================================
   GET FIREBASE USER
========================================================= */

function getFirebaseUser() {

  if (
    typeof firebaseAuth !== "undefined" &&
    firebaseAuth.currentUser
  ) {

    return firebaseAuth.currentUser;

  }

  if (
    typeof window.firebaseAuth !== "undefined" &&
    window.firebaseAuth.currentUser
  ) {

    return window.firebaseAuth.currentUser;

  }

  return null;

}


/* =========================================================
   UPDATE BALANCE DISPLAY
========================================================= */

function updateWithdrawBalance(balance) {

  const element =
    document.getElementById("withdrawBalance");

  if (!element) {
    return;
  }

  const numericBalance =
    Number(balance || 0);

  element.textContent =
    numericBalance.toFixed(2);

}


/* =========================================================
   LOAD FIREBASE BALANCE
========================================================= */

async function loadFirebaseBalance() {

  const user =
    getFirebaseUser();

  if (!user) {
    updateWithdrawBalance(0);
    return 0;
  }


  try {

    const walletRef =
      firebaseDb
        .collection("wallets")
        .doc(user.uid);

    const walletSnap =
      await walletRef.get();


    if (walletSnap.exists) {

      const walletData =
        walletSnap.data() || {};

      const walletBalance =
        Number(walletData.balance || 0);

      updateWithdrawBalance(walletBalance);

      return walletBalance;

    }


    /*
      Compatibility fallback:
      If wallets/{uid} does not exist,
      use profiles/{uid}.balance.
    */

    const profileRef =
      firebaseDb
        .collection("profiles")
        .doc(user.uid);

    const profileSnap =
      await profileRef.get();


    if (profileSnap.exists) {

      const profileData =
        profileSnap.data() || {};

      const profileBalance =
        Number(profileData.balance || 0);

      updateWithdrawBalance(profileBalance);

      return profileBalance;

    }


    updateWithdrawBalance(0);

    return 0;

  } catch (error) {

    console.error(
      "Firebase balance load error:",
      error
    );

    /*
      Keep compatibility with the current app
      if Firebase temporarily cannot be read.
    */

    const localBalance =
      Number(
        localStorage.getItem(
          "worker_balance"
        ) || "0"
      );

    updateWithdrawBalance(localBalance);

    return localBalance;

  }

}


/* =========================================================
   LOAD WITHDRAWAL HISTORY
========================================================= */

async function loadWithdrawHistory() {

  const container =
    document.getElementById(
      "historyContainer"
    );

  if (!container) {
    return;
  }


  const user =
    getFirebaseUser();


  if (!user) {

    container.innerHTML = `
      <div class="history-icon">🔐</div>
      <div>Please login to view withdrawal history.</div>
    `;

    return;

  }


  try {

    const snapshot =
      await firebaseDb
        .collection("withdrawals")
        .where(
          "userId",
          "==",
          user.uid
        )
        .get();


    if (snapshot.empty) {

      container.className =
        "history-empty";

      container.innerHTML = `
        <div class="history-icon">💳</div>
        <div>No withdrawal history yet.</div>
      `;

      return;

    }


    const records =
      snapshot.docs
        .map(function(doc) {

          const data =
            doc.data() || {};

          return {
            id: doc.id,
            ...data
          };

        })
        .sort(function(a, b) {

          const aTime =
            a.createdAt &&
            typeof a.createdAt.toMillis === "function"
              ? a.createdAt.toMillis()
              : 0;

          const bTime =
            b.createdAt &&
            typeof b.createdAt.toMillis === "function"
              ? b.createdAt.toMillis()
              : 0;

          return bTime - aTime;

        });


    container.className =
      "history-list";


    container.innerHTML =
      records
        .map(function(record) {

          const amount =
            Number(record.amount || 0);


          const method =
            escapeHtmlSafe(
              record.method || "Payment"
            );


          const status =
            escapeHtmlSafe(
              record.status || "Pending"
            );


          const masked =
            escapeHtmlSafe(
              record.paymentMasked || ""
            );


          return `
            <div class="history-item">

              <div class="history-row">

                <div class="history-method">
                  ${method}
                  ${masked ? " • " + masked : ""}
                </div>

                <div class="history-amount">
                  ${amount.toFixed(2)} coins
                </div>

              </div>

              <div class="history-status">
                Status: ${status}
              </div>

              <div class="history-date">
                ${formatDate(record.createdAt)}
              </div>

            </div>
          `;

        })
        .join("");


  } catch (error) {

    console.error(
      "Withdrawal history error:",
      error
    );


    container.className =
      "history-empty";


    container.innerHTML = `
      <div class="history-icon">💳</div>
      <div>Unable to load withdrawal history.</div>
    `;

  }

}


/* =========================================================
   SUBMIT WITHDRAW
========================================================= */

async function submitWithdraw() {

  if (withdrawSubmitting) {
    return;
  }


  /*
    Wait for Firebase authentication state.
  */

  if (!firebaseAuthReady) {

    alert(
      "Please wait a moment and try again."
    );

    return;

  }


  const user =
    getFirebaseUser();


  if (!user) {

    alert(
      "Please login before submitting a withdrawal."
    );

    window.location.href =
      "login.html";

    return;

  }


  const paymentInput =
    document.getElementById("payment");


  const amountInput =
    document.getElementById("amount");


  const submitButton =
    document.getElementById(
      "withdrawButton"
    );


  const payment =
    paymentInput
      ? paymentInput.value.trim()
      : "";


  const amount =
    amountInput
      ? Number(amountInput.value)
      : 0;


  if (!payment) {

    alert(
      "Please enter your bKash / Nagad number."
    );

    return;

  }


  if (
    !amount ||
    !Number.isFinite(amount) ||
    amount < 510 ||
    amount > 5000
  ) {

    alert(
      "Withdrawal amount must be between 510 and 5000 coins."
    );

    return;

  }


  /*
    Prevent accidental duplicate submissions.
  */

  withdrawSubmitting = true;


  if (submitButton) {

    submitButton.disabled = true;
    submitButton.textContent =
      "Processing...";

  }


  try {

    const userRef =
      firebaseDb
        .collection("profiles")
        .doc(user.uid);


    const walletRef =
      firebaseDb
        .collection("wallets")
        .doc(user.uid);


    const withdrawalRef =
      firebaseDb
        .collection("withdrawals")
        .doc();


    let finalUsername =
      user.displayName ||
      localStorage.getItem(
        "worker_username"
      ) ||
      "User";


    let finalEmail =
      user.email ||
      localStorage.getItem(
        "worker_email"
      ) ||
      "";


    /*
      Read profile first for username/email.
    */

    const profileSnap =
      await userRef.get();


    if (profileSnap.exists) {

      const profileData =
        profileSnap.data() || {};


      finalUsername =
        profileData.username ||
        finalUsername;


      finalEmail =
        profileData.email ||
        finalEmail;

    }


    /*
      Firestore transaction:
      1. Read wallet
      2. Read profile
      3. Check balance
      4. Deduct amount
      5. Create withdrawal request
      6. Keep profile and wallet balances synchronized
    */

    await firebaseDb.runTransaction(
      async function(transaction) {

        const walletSnap =
          await transaction.get(
            walletRef
          );


        const profileSnapInside =
          await transaction.get(
            userRef
          );


        const walletData =
          walletSnap.exists
            ? (walletSnap.data() || {})
            : {};


        const profileData =
          profileSnapInside.exists
            ? (profileSnapInside.data() || {})
            : {};


        let balance;


        if (
          walletSnap.exists &&
          walletData.balance !== undefined
        ) {

          balance =
            Number(walletData.balance || 0);

        } else {

          balance =
            Number(profileData.balance || 0);

        }


        if (
          !Number.isFinite(balance) ||
          balance < amount
        ) {

          throw new Error(
            "INSUFFICIENT_BALANCE"
          );

        }


        const newBalance =
          Number(
            (balance - amount).toFixed(2)
          );


        /*
          Create/update wallet.
        */

        if (walletSnap.exists) {

          transaction.update(
            walletRef,
            {
              balance: newBalance,
              updatedAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()
            }
          );

        } else {

          transaction.set(
            walletRef,
            {
              userId: user.uid,
              balance: newBalance,
              pending_balance: 0,
              total_earned: 0,
              total_withdrawn: 0,
              updatedAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()
            }
          );

        }


        /*
          Keep profile balance synchronized.
        */

        if (profileSnapInside.exists) {

          transaction.update(
            userRef,
            {
              balance: newBalance,
              updatedAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()
            }
          );

        } else {

          transaction.set(
            userRef,
            {
              username: finalUsername,
              email: finalEmail,
              balance: newBalance,
              createdAt:
                firebase.firestore.FieldValue
                  .serverTimestamp(),
              updatedAt:
                firebase.firestore.FieldValue
                  .serverTimestamp()
            }
          );

        }


        /*
          Withdrawal record.
        */

        transaction.set(
          withdrawalRef,
          {
            userId: user.uid,
            username: finalUsername,
            email: finalEmail,

            method: "bKash / Nagad",

            paymentMasked:
              maskPaymentNumber(payment),

            amount: amount,

            status: "Pending",

            createdAt:
              firebase.firestore.FieldValue
                .serverTimestamp()
          }
        );

      }
    );


    /*
      Compatibility localStorage update.
      Firebase remains the actual backend.
    */

    const oldLocalBalance =
      Number(
        localStorage.getItem(
          "worker_balance"
        ) || "0"
      );


    const newLocalBalance =
      Math.max(
        0,
        Number(
          (oldLocalBalance - amount)
            .toFixed(2)
        )
      );


    localStorage.setItem(
      "worker_balance",
      String(newLocalBalance)
    );


    /*
      Refresh Firebase balance/history.
    */

    await loadFirebaseBalance();

    await loadWithdrawHistory();


    /*
      Smartlink remains tied to the
      user's explicit Submit Withdraw action.
    */

    if (
      typeof openSmartlink === "function"
    ) {

      try {
        openSmartlink();
      } catch (smartlinkError) {
        console.warn(
          "Smartlink error:",
          smartlinkError
        );
      }

    }


    alert(
      "Withdrawal request submitted successfully."
    );


    if (paymentInput) {
      paymentInput.value = "";
    }


    if (amountInput) {
      amountInput.value = "";
    }


  } catch (error) {

    console.error(
      "Withdrawal submit error:",
      error
    );


    if (
      error &&
      error.message ===
      "INSUFFICIENT_BALANCE"
    ) {

      alert(
        "Insufficient balance."
      );

    } else {

      alert(
        "Withdrawal failed. Please try again."
      );

    }

  } finally {

    withdrawSubmitting = false;


    if (submitButton) {

      submitButton.disabled = false;

      submitButton.textContent =
        "Submit Withdraw";

    }

  }

}


/* =========================================================
   FIREBASE AUTH STATE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    /*
      Do not use localStorage as the main
      authentication source anymore.
    */

    if (
      typeof firebaseAuth === "undefined"
    ) {

      console.error(
        "Firebase Auth is not available."
      );

      return;

    }


    firebaseAuth.onAuthStateChanged(
      async function(user) {

        currentFirebaseUser =
          user || null;

        firebaseAuthReady = true;


        if (!user) {

          updateWithdrawBalance(0);

          const container =
            document.getElementById(
              "historyContainer"
            );

          if (container) {

            container.className =
              "history-empty";

            container.innerHTML = `
              <div class="history-icon">🔐</div>
              <div>Please login to view withdrawal history.</div>
            `;

          }

          return;

        }


        /*
          Keep compatibility values for
          the existing UI/app.js.
        */

        localStorage.setItem(
          "worker_logged_in",
          "true"
        );


        if (user.email) {

          localStorage.setItem(
            "worker_email",
            user.email
          );

        }


        try {

          const profileSnap =
            await firebaseDb
              .collection("profiles")
              .doc(user.uid)
              .get();


          if (profileSnap.exists) {

            const profileData =
              profileSnap.data() || {};


            if (
              profileData.username
            ) {

              localStorage.setItem(
                "worker_username",
                profileData.username
              );

            }

          }

        } catch (error) {

          console.warn(
            "Profile compatibility load failed:",
            error
          );

        }


        await loadFirebaseBalance();

        await loadWithdrawHistory();

      }
    );

  }
);

</script>
