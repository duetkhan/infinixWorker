<script>

/* =========================================================
   FIREBASE WITHDRAW STATE
========================================================= */

let currentFirebaseUser = null;

let firebaseAuthReady = false;

let withdrawSubmitting = false;



/* =========================================================
   FIREBASE USER
========================================================= */

function getFirebaseUser() {

  if (
    typeof firebaseAuth !== "undefined" &&
    firebaseAuth.currentUser
  ) {

    return firebaseAuth.currentUser;

  }

  return null;
}



/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtmlSafe(value) {

  return String(value || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );
}



/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(timestamp) {

  try {

    if (!timestamp) {

      return "Date unavailable";

    }


    if (
      typeof timestamp.toDate ===
      "function"
    ) {

      return timestamp
        .toDate()
        .toLocaleString();

    }


    const date =
      new Date(timestamp);


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return "Date unavailable";

    }


    return date.toLocaleString();

  } catch (error) {

    return "Date unavailable";

  }
}



/* =========================================================
   MASK PAYMENT NUMBER
========================================================= */

function maskPaymentNumber(value) {

  const text =
    String(value || "")
      .trim();


  if (text.length <= 4) {

    return text;

  }


  return "••••" +
    text.slice(-4);
}



/* =========================================================
   UPDATE BALANCE UI
========================================================= */

function updateWithdrawBalance(balance) {

  const element =
    document.getElementById(
      "withdrawBalance"
    );


  if (!element) {

    return;

  }


  const numericBalance =
    Number(balance || 0);


  element.textContent =
    Number.isFinite(
      numericBalance
    )

      ? numericBalance.toFixed(2)

      : "0.00";
}



/* =========================================================
   LOAD FIREBASE BALANCE
========================================================= */

async function loadFirebaseBalance() {

  const user =
    getFirebaseUser();


  if (!user) {

    updateWithdrawBalance(0);

    return 0;

  }


  try {

    const walletRef =
      firebaseDb
        .collection("wallets")
        .doc(user.uid);


    const walletSnap =
      await walletRef.get();


    if (walletSnap.exists) {

      const walletData =
        walletSnap.data() || {};


      const balance =
        Number(
          walletData.balance || 0
        );


      updateWithdrawBalance(
        balance
      );


      return balance;

    }



    /*
      Compatibility fallback:
      If wallet does not exist,
      read profile balance.
    */

    const profileSnap =
      await firebaseDb
        .collection("profiles")
        .doc(user.uid)
        .get();


    if (profileSnap.exists) {

      const profileData =
        profileSnap.data() || {};


      const balance =
        Number(
          profileData.balance || 0
        );


      updateWithdrawBalance(
        balance
      );


      return balance;

    }


    updateWithdrawBalance(0);

    return 0;


  } catch (error) {

    console.error(
      "Firebase balance load error:",
      error
    );


    /*
      IMPORTANT:
      No localStorage fallback.

      Firebase is the only
      source of truth.
    */

    updateWithdrawBalance(0);

    return 0;

  }
}



/* =========================================================
   LOAD WITHDRAWAL HISTORY
========================================================= */

async function loadWithdrawHistory() {

  const container =
    document.getElementById(
      "historyContainer"
    );


  if (!container) {

    return;

  }


  const user =
    getFirebaseUser();


  if (!user) {

    container.className =
      "history-empty";


    container.innerHTML = `

      <div class="history-icon">
        🔐
      </div>

      <div>
        Please login to view withdrawal history.
      </div>

    `;


    return;

  }


  try {

    const snapshot =
      await firebaseDb
        .collection("withdrawals")
        .where(
          "userId",
          "==",
          user.uid
        )
        .get();


    if (snapshot.empty) {

      container.className =
        "history-empty";


      container.innerHTML = `

        <div class="history-icon">
          💳
        </div>

        <div>
          No withdrawal history yet.
        </div>

      `;


      return;

    }



    const records =
      snapshot.docs
        .map(
          function(doc) {

            return {

              id:
                doc.id,

              ...(
                doc.data() || {}
              )

            };

          }
        )

        .sort(
          function(a, b) {

            const aTime =
              a.createdAt &&
              typeof
              a.createdAt.toMillis ===
              "function"

                ? a.createdAt.toMillis()

                : 0;


            const bTime =
              b.createdAt &&
              typeof
              b.createdAt.toMillis ===
              "function"

                ? b.createdAt.toMillis()

                : 0;


            return bTime - aTime;

          }
        );



    container.className =
      "history-list";


    container.innerHTML =
      records
        .map(
          function(record) {


            const amount =
              Number(
                record.amount || 0
              );


            const method =
              escapeHtmlSafe(
                record.method ||
                "Payment"
              );


            const status =
              escapeHtmlSafe(
                record.status ||
                "Pending"
              );


            const masked =
              escapeHtmlSafe(
                record.paymentMasked ||
                ""
              );


            return `

              <div class="history-item">


                <div class="history-row">


                  <div class="history-method">

                    ${method}

                    ${
                      masked
                        ? " • " + masked
                        : ""
                    }

                  </div>


                  <div class="history-amount">

                    ${
                      amount.toFixed(2)
                    }

                    coins

                  </div>


                </div>



                <div class="history-status">

                  Status:
                  ${status}

                </div>



                <div class="history-date">

                  ${
                    formatDate(
                      record.createdAt
                    )
                  }

                </div>


              </div>

            `;

          }
        )
        .join("");


  } catch (error) {

    console.error(
      "Withdrawal history error:",
      error
    );


    container.className =
      "history-empty";


    container.innerHTML = `

      <div class="history-icon">
        ⚠️
      </div>

      <div>
        Unable to load withdrawal history.
      </div>

    `;

  }

}



/* =========================================================
   SUBMIT WITHDRAW
========================================================= */

async function submitWithdraw() {


  if (withdrawSubmitting) {

    return;

  }


  if (!firebaseAuthReady) {

    alert(
      "Please wait a moment and try again."
    );

    return;

  }


  const user =
    getFirebaseUser();


  if (!user) {

    alert(
      "Please login before submitting a withdrawal."
    );


    window.location.href =
      "login.html";


    return;

  }



  const paymentInput =
    document.getElementById(
      "payment"
    );


  const amountInput =
    document.getElementById(
      "amount"
    );


  const submitButton =
    document.getElementById(
      "withdrawButton"
    );



  const payment =
    paymentInput
      ? paymentInput.value.trim()
      : "";



  const amount =
    amountInput
      ? Number(
          amountInput.value
        )
      : 0;



  /* =========================================
     PAYMENT VALIDATION
  ========================================== */

  if (!payment) {

    alert(
      "Please enter your bKash / Nagad number."
    );

    return;

  }



  if (payment.length < 8) {

    alert(
      "Please enter a valid payment number."
    );

    return;

  }



  /* =========================================
     AMOUNT VALIDATION
  ========================================== */

  if (
    !Number.isFinite(amount) ||
    amount < 510 ||
    amount > 5000
  ) {

    alert(
      "Withdrawal amount must be between 510 and 5000 coins."
    );

    return;

  }



  /*
    Only whole-number withdrawals.
  */

  if (
    !Number.isInteger(amount)
  ) {

    alert(
      "Withdrawal amount must be a whole number."
    );

    return;

  }



  withdrawSubmitting = true;



  if (submitButton) {

    submitButton.disabled = true;

    submitButton.textContent =
      "Processing...";

  }



  try {


    /* =====================================
       FIRESTORE REFERENCES
    ====================================== */

    const profileRef =
      firebaseDb
        .collection("profiles")
        .doc(user.uid);


    const walletRef =
      firebaseDb
        .collection("wallets")
        .doc(user.uid);


    const withdrawalRef =
      firebaseDb
        .collection("withdrawals")
        .doc();



    /* =====================================
       USER INFORMATION
    ====================================== */

    let username =
      user.displayName ||
      "User";


    let email =
      user.email ||
      "";



    try {

      const profileSnap =
        await profileRef.get();


      if (profileSnap.exists) {

        const profileData =
          profileSnap.data() || {};


        username =
          profileData.username ||
          username;


        email =
          profileData.email ||
          email;

      }

    } catch (profileReadError) {

      console.warn(
        "Profile read failed:",
        profileReadError
      );

    }



    /* =====================================
       ATOMIC WITHDRAWAL TRANSACTION

       EVERYTHING BELOW HAPPENS ATOMICALLY:

       1. Read wallet
       2. Read profile
       3. Determine balance
       4. Check balance
       5. Deduct amount
       6. Sync profile
       7. Create withdrawal

       If anything fails,
       Firestore rolls everything back.
    ====================================== */

    await firebaseDb.runTransaction(
      async function(transaction) {


        /* =================================
           READ WALLET
        ================================== */

        const walletSnap =
          await transaction.get(
            walletRef
          );


        /* =================================
           READ PROFILE
        ================================== */

        const profileSnap =
          await transaction.get(
            profileRef
          );



        const walletData =
          walletSnap.exists

            ? (
                walletSnap.data() ||
                {}
              )

            : {};



        const profileData =
          profileSnap.exists

            ? (
                profileSnap.data() ||
                {}
              )

            : {};



        /* =================================
           DETERMINE CURRENT BALANCE
        ================================== */

        let balance = 0;


        if (
          walletSnap.exists &&
          walletData.balance !== undefined
        ) {

          balance =
            Number(
              walletData.balance || 0
            );

        } else {

          balance =
            Number(
              profileData.balance || 0
            );

        }



        /* =================================
           BALANCE VALIDATION
        ================================== */

        if (
          !Number.isFinite(balance)
        ) {

          throw new Error(
            "INVALID_BALANCE"
          );

        }



        if (
          balance < amount
        ) {

          throw new Error(
            "INSUFFICIENT_BALANCE"
          );

        }



        /* =================================
           CALCULATE NEW BALANCE
        ================================== */

        const newBalance =
          Number(
            (
              balance -
              amount
            ).toFixed(2)
          );



        if (
          newBalance < 0
        ) {

          throw new Error(
            "INSUFFICIENT_BALANCE"
          );

        }



        /* =================================
           UPDATE WALLET
        ================================== */

        if (walletSnap.exists) {

          transaction.update(
            walletRef,
            {

              balance:
                newBalance,

              updatedAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp()

            }
          );

        } else {

          transaction.set(
            walletRef,
            {

              userId:
                user.uid,

              balance:
                newBalance,

              pending_balance:
                0,

              total_earned:
                0,

              total_withdrawn:
                0,

              updatedAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp()

            }
          );

        }



        /* =================================
           SYNC PROFILE BALANCE
        ================================== */

        if (profileSnap.exists) {

          transaction.update(
            profileRef,
            {

              balance:
                newBalance,

              updatedAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp()

            }
          );

        } else {

          transaction.set(
            profileRef,
            {

              username:
                username,

              email:
                email,

              balance:
                newBalance,

              createdAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp(),

              updatedAt:
                firebase.firestore
                  .FieldValue
                  .serverTimestamp()

            }
          );

        }



        /* =================================
           CREATE WITHDRAWAL REQUEST
        ================================== */

        transaction.set(
          withdrawalRef,
          {

            userId:
              user.uid,

            username:
              username,

            email:
              email,

            method:
              "bKash / Nagad",

            paymentMasked:
              maskPaymentNumber(
                payment
              ),

            amount:
              amount,

            status:
              "Pending",

            createdAt:
              firebase.firestore
                .FieldValue
                .serverTimestamp()

          }
        );


      }
    );



    /* =====================================
       REFRESH FROM FIREBASE
    ====================================== */

    await loadFirebaseBalance();


    await loadWithdrawHistory();



    /* =====================================
       SMARTLINK

       Existing behavior preserved.
    ====================================== */

    if (
      typeof openSmartlink ===
      "function"
    ) {

      try {

        openSmartlink();

      } catch (smartlinkError) {

        console.warn(
          "Smartlink error:",
          smartlinkError
        );

      }

    }



    /* =====================================
       SUCCESS
    ====================================== */

    alert(
      "Withdrawal request submitted successfully."
    );



    if (paymentInput) {

      paymentInput.value =
        "";

    }


    if (amountInput) {

      amountInput.value =
        "";

    }



  } catch (error) {


    console.error(
      "Withdrawal submit error:",
      error
    );



    /* =====================================
       KNOWN ERRORS
    ====================================== */

    if (
      error &&
      error.message ===
      "INSUFFICIENT_BALANCE"
    ) {

      alert(
        "Insufficient balance."
      );

    }

    else if (
      error &&
      error.message ===
      "INVALID_BALANCE"
    ) {

      alert(
        "Your account balance could not be verified. Please try again."
      );

    }

    else if (
      error &&
      (
        error.code ===
        "permission-denied"
      )
    ) {

      alert(
        "Withdrawal permission denied. Please login again and try."
      );

    }

    else if (
      error &&
      (
        error.code ===
        "failed-precondition"
      )
    ) {

      alert(
        "Please wait a moment and try again."
      );

    }

    else {

      alert(
        "Withdrawal failed. Please try again."
      );

    }


  } finally {


    withdrawSubmitting =
      false;


    if (submitButton) {

      submitButton.disabled =
        false;


      submitButton.textContent =
        "Submit Withdraw";

    }

  }

}



/* =========================================================
   FIREBASE AUTH STATE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {


    if (
      typeof firebaseAuth ===
      "undefined"
    ) {

      console.error(
        "Firebase Auth is not available."
      );


      const container =
        document.getElementById(
          "historyContainer"
        );


      if (container) {

        container.className =
          "history-empty";


        container.innerHTML = `

          <div class="history-icon">
            ⚠️
          </div>

          <div>
            Firebase is not available.
          </div>

        `;

      }


      return;

    }



    firebaseAuth.onAuthStateChanged(
      async function(user) {


        currentFirebaseUser =
          user || null;


        firebaseAuthReady =
          true;



        /* =================================
           NOT LOGGED IN
        ================================== */

        if (!user) {


          updateWithdrawBalance(0);


          const container =
            document.getElementById(
              "historyContainer"
            );


          if (container) {

            container.className =
              "history-empty";


            container.innerHTML = `

              <div class="history-icon">
                🔐
              </div>

              <div>
                Please login to view withdrawal history.
              </div>

            `;

          }


          return;

        }



        /* =================================
           LOGGED IN
        ================================== */

        await loadFirebaseBalance();


        await loadWithdrawHistory();


      }
    );

  }
);

</script>
