<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;
      background: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
    }


    header {
      text-align: center;
      padding: 25px 15px;
      background: #191919;
      border-bottom: 1px solid #333;
    }


    header h1 {
      margin: 0;
      font-size: 30px;
    }


    .container {
      max-width: 650px;
      margin: auto;
      padding: 20px;
    }


    .card {
      background: #1b1b1b;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 22px;
      margin: 18px 0;
    }


    .balance {
      text-align: center;
      font-size: 28px;
      color: #ffd43b;
      font-weight: bold;
    }


    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
    }


    input,
    select {

      width: 100%;
      padding: 13px;

      border-radius: 8px;
      border: 1px solid #555;

      background: #111;
      color: #fff;

      font-size: 15px;
    }


    button,
    .back-btn {

      width: 100%;

      padding: 13px;

      margin-top: 15px;

      border: 0;

      border-radius: 8px;

      font-size: 15px;

      cursor: pointer;

      text-decoration: none;

      display: block;

      text-align: center;
    }


    .submit-btn {

      background: #16a34a;

      color: #fff;

      font-weight: bold;
    }


    .submit-btn:disabled {

      opacity: .6;

      cursor: not-allowed;
    }


    .back-btn {

      background: #333;

      color: #fff;
    }


    .status {

      background: #242424;

      padding: 14px;

      border-radius: 9px;

      margin-top: 15px;

      line-height: 1.5;
    }


    .history-item {

      background: #242424;

      border-radius: 9px;

      padding: 14px;

      margin-top: 10px;
    }


    .coin {

      color: #ffd43b;

      font-weight: bold;
    }


    .ad-box {

      width: 100%;

      display: flex;

      justify-content: center;

      margin: 20px auto;

      overflow: hidden;
    }


    .hidden {

      display: none !important;
    }

  </style>

</head>


<body>


<header>

  <h1>💸 Withdraw</h1>

  <p>
    Request your coin withdrawal
  </p>

</header>


<div class="container">


  <!-- =========================================
       TOP AD
  ========================================== -->

  <div class="ad-box">

    <script>

      atOptions = {

        'key':
          '2a7ac0b46ca2d6ecef70fb7f768ae8cf',

        'format':
          'iframe',

        'height':
          50,

        'width':
          320,

        'params':
          {}

      };

    </script>


    <script src="https://www.highperformanceformat.com/2a7ac0b46ca2d6ecef70fb7f768ae8cf/invoke.js"></script>

  </div>


  <!-- =========================================
       BALANCE
  ========================================== -->

  <div class="card">

    <h2>
      🪙 Available Balance
    </h2>


    <div class="balance">

      <span id="balance">
        0
      </span>

      Coins

    </div>

  </div>


  <!-- =========================================
       WITHDRAW FORM
  ========================================== -->

  <div
    class="card"
    id="withdrawCard"
  >

    <h2>
      💸 Request Withdrawal
    </h2>


    <label for="withdrawAmount">

      Amount (Coins)

    </label>


    <input
      type="number"
      id="withdrawAmount"
      min="110"
      step="1"
      placeholder="Minimum 110 Coins"
    >


    <label for="withdrawMethod">

      Payment Method

    </label>


    <select id="withdrawMethod">

      <option value="">
        Select payment method
      </option>

      <option value="bKash">
        bKash
      </option>

      <option value="Nagad">
        Nagad
      </option>

      <option value="PayPal">
        PayPal
      </option>

      <option value="Binance">
        Binance
      </option>

    </select>


    <label for="accountDetails">

      Payment Account

    </label>


    <input
      type="text"
      id="accountDetails"
      placeholder="Enter number / email / wallet"
    >


    <button
      class="submit-btn"
      id="withdrawButton"
      onclick="requestWithdrawal()"
    >

      Submit Withdrawal

    </button>


    <div id="withdrawMessage"></div>

  </div>


  <!-- =========================================
       LOGIN MESSAGE
  ========================================== -->

  <div
    id="loginMessage"
    class="status hidden"
  >

    Please login to request a withdrawal.

  </div>


  <!-- =========================================
       HISTORY
  ========================================== -->

  <div class="card">

    <h2>
      📋 Withdrawal History
    </h2>


    <div id="withdrawalList">

      <div class="status">

        Login to view withdrawal history.

      </div>

    </div>

  </div>


  <!-- =========================================
       BACK
  ========================================== -->

  <a
    href="tasks.html"
    class="back-btn"
  >

    ← Back to Micro Tasks

  </a>


  <!-- =========================================
       BOTTOM AD
  ========================================== -->

  <div class="ad-box">

    <script>

      atOptions = {

        'key':
          '3f673e5d02626eb857acc774c36f56a6',

        'format':
          'iframe',

        'height':
          60,

        'width':
          468,

        'params':
          {}

      };

    </script>


    <script src="https://www.highperformanceformat.com/3f673e5d02626eb857acc774c36f56a6/invoke.js"></script>

  </div>


</div>



<script>

/* =========================================================
   FIREBASE REFERENCES
========================================================= */

let currentUser = null;

let currentBalance = 0;



/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


function formatDate(value) {

  if (!value) {
    return "";
  }


  try {

    /*
      Firestore Timestamp
    */

    if (
      value &&
      typeof value.toDate === "function"
    ) {

      return value
        .toDate()
        .toLocaleString();

    }


    return new Date(value)
      .toLocaleString();

  }

  catch (error) {

    return "";

  }

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text) {

  const message =
    document.getElementById(
      "withdrawMessage"
    );


  message.innerHTML =
    `<div class="status">
      ${escapeHtml(text)}
    </div>`;

}


/* =========================================================
   LOGGED OUT
========================================================= */

function showLoggedOut() {

  document
    .getElementById("withdrawCard")
    .classList.add("hidden");


  document
    .getElementById("loginMessage")
    .classList.remove("hidden");


  document
    .getElementById("balance")
    .textContent = "0";


  document
    .getElementById("withdrawalList")
    .innerHTML =
      `<div class="status">
        Login to view withdrawal history.
      </div>`;

}


/* =========================================================
   LOAD WALLET FROM FIRESTORE
========================================================= */

async function loadWallet() {

  if (!currentUser) {
    return;
  }


  try {

    const profile =
      await firebaseDb
        .collection("profiles")
        .doc(currentUser.uid)
        .get();


    if (!profile.exists) {

      currentBalance = 0;

      document
        .getElementById("balance")
        .textContent = "0";

      return;

    }


    const data =
      profile.data();


    currentBalance =
      Number(data.balance || 0);


    document
      .getElementById("balance")
      .textContent =
        currentBalance;


    /*
      Keep the current app's local
      balance display synchronized.
    */

    localStorage.setItem(
      "worker_balance",
      currentBalance.toFixed(2)
    );


    if (data.username) {

      localStorage.setItem(
        "worker_username",
        data.username
      );

    }


    if (data.email) {

      localStorage.setItem(
        "worker_email",
        data.email
      );

    }

  }

  catch (error) {

    console.error(
      "Firebase wallet error:",
      error
    );


    showMessage(
      "Unable to load your balance."
    );

  }

}


/* =========================================================
   REQUEST WITHDRAWAL
========================================================= */

async function requestWithdrawal() {

  if (!currentUser) {

    window.location.href =
      "login.html";

    return;

  }


  const amount =
    Number(
      document
        .getElementById(
          "withdrawAmount"
        )
        .value
    );


  const method =
    document
      .getElementById(
        "withdrawMethod"
      )
      .value;


  const accountDetails =
    document
      .getElementById(
        "accountDetails"
      )
      .value
      .trim();


  const button =
    document.getElementById(
      "withdrawButton"
    );


  /* =========================================
     VALID AMOUNT
  ========================================== */

  if (
    !Number.isInteger(amount) ||
    amount <= 0
  ) {

    showMessage(
      "Enter a valid withdrawal amount."
    );

    return;

  }


  /* =========================================
     MINIMUM 110 COINS
  ========================================== */

  if (amount < 110) {

    showMessage(
      "Minimum withdrawal amount is 110 Coins."
    );

    return;

  }


  /* =========================================
     PAYMENT METHOD
  ========================================== */

  if (!method) {

    showMessage(
      "Select a payment method."
    );

    return;

  }


  /* =========================================
     PAYMENT ACCOUNT
  ========================================== */

  if (!accountDetails) {

    showMessage(
      "Enter your payment account."
    );

    return;

  }


  /* =========================================
     BALANCE CHECK
  ========================================== */

  if (amount > currentBalance) {

    showMessage(
      "Insufficient balance."
    );

    return;

  }


  button.disabled =
    true;


  showMessage(
    "Processing..."
  );


  try {

    /*
      Firestore transaction:

      1. Read current profile balance
      2. Verify sufficient balance
      3. Deduct requested coins
      4. Create withdrawal request

      Both actions happen together.
    */

    await firebaseDb.runTransaction(
      async function(transaction) {


        const profileRef =
          firebaseDb
            .collection("profiles")
            .doc(currentUser.uid);


        const withdrawalRef =
          firebaseDb
            .collection("withdrawals")
            .doc();


        const profileSnap =
          await transaction.get(
            profileRef
          );


        if (!profileSnap.exists) {

          throw new Error(
            "Profile not found."
          );

        }


        const profileData =
          profileSnap.data();


        const balance =
          Number(
            profileData.balance || 0
          );


        if (balance < amount) {

          throw new Error(
            "Insufficient balance."
          );

        }


        /*
          Deduct balance
        */

        transaction.update(
          profileRef,
          {

            balance:
              balance - amount

          }
        );


        /*
          Create withdrawal record
        */

        transaction.set(
          withdrawalRef,
          {

            id:
              withdrawalRef.id,

            userId:
              currentUser.uid,

            amount:
              amount,

            method:
              method,

            accountDetails:
              accountDetails,

            status:
              "pending",

            requestedAt:
              firebase.firestore.FieldValue
                .serverTimestamp(),

            processedAt:
              null,

            adminNote:
              ""

          }
        );

      }
    );


    /*
      Success
    */

    showMessage(
      "✅ Withdrawal request submitted successfully."
    );


    /*
      Clear fields
    */

    document
      .getElementById(
        "withdrawAmount"
      )
      .value = "";


    document
      .getElementById(
        "accountDetails"
      )
      .value = "";


    /*
      Reload balance and history
    */

    await loadWallet();

    await loadWithdrawals();

  }

  catch (error) {

    console.error(
      "Firebase withdrawal error:",
      error
    );


    showMessage(
      error.message ||
      "Unable to submit withdrawal request."
    );

  }


  button.disabled =
    false;

}


/* =========================================================
   LOAD WITHDRAWAL HISTORY
========================================================= */

async function loadWithdrawals() {

  if (!currentUser) {
    return;
  }


  const list =
    document.getElementById(
      "withdrawalList"
    );


  try {

    const snapshot =
      await firebaseDb
        .collection("withdrawals")
        .where(
          "userId",
          "==",
          currentUser.uid
        )
        .get();


    if (
      snapshot.empty
    ) {

      list.innerHTML =
        `<div class="status">
          No withdrawal requests yet.
        </div>`;

      return;

    }


    const data =
      snapshot.docs
        .map(
          function(doc) {

            return doc.data();

          }
        )
        .sort(
          function(a, b) {

            const dateA =
              a.requestedAt &&
              typeof a.requestedAt.toMillis ===
                "function"

                ? a.requestedAt.toMillis()

                : 0;


            const dateB =
              b.requestedAt &&
              typeof b.requestedAt.toMillis ===
                "function"

                ? b.requestedAt.toMillis()

                : 0;


            return dateB - dateA;

          }
        );


    list.innerHTML =
      data
        .map(
          function(item) {

            return `

              <div class="history-item">

                💸

                <span class="coin">

                  ${Number(
                    item.amount || 0
                  )}

                  Coins

                </span>

                <br><br>

                Method:

                ${escapeHtml(
                  item.method
                )}

                <br>

                Status:

                <strong>

                  ${escapeHtml(
                    item.status
                  )}

                </strong>

                <br>

                Requested:

                ${escapeHtml(
                  formatDate(
                    item.requestedAt
                  )
                )}

                ${
                  item.adminNote
                    ? `
                      <br>
                      Note:
                      ${escapeHtml(
                        item.adminNote
                      )}
                    `
                    : ""
                }

              </div>

            `;

          }
        )
        .join("");

  }

  catch (error) {

    console.error(
      "Firebase withdrawal history error:",
      error
    );


    list.innerHTML =
      `<div class="status">
        Unable to load withdrawal history.
      </div>`;

  }

}


/* =========================================================
   FIREBASE AUTH STATE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {


    if (
      typeof firebaseAuth ===
      "undefined" ||
      typeof firebaseDb ===
      "undefined"
    ) {

      console.error(
        "Firebase is not initialized."
      );


      showLoggedOut();

      return;

    }


    firebaseAuth.onAuthStateChanged(
      async function(user) {


        if (user) {

          currentUser =
            user;


          /*
            Keep current local session
            compatible with app.js.
          */

          localStorage.setItem(
            "worker_logged_in",
            "true"
          );


          localStorage.setItem(
            "worker_email",
            user.email || ""
          );


          await loadWallet();

          await loadWithdrawals();

        }

        else {

          currentUser =
            null;

          showLoggedOut();

        }

      }
    );

  }
);

</script>


</body>
</html>
