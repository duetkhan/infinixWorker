<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#1769e0">

  <title>Withdraw - Infinix Worker</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .withdraw-page {
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .top-ad {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 8px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .withdraw-header {
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      padding: 15px 16px 18px;
      border-radius: 0 0 24px 24px;
      box-shadow: 0 5px 18px rgba(23,105,224,.20);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .back-button {
      width: 39px;
      height: 39px;
      border: 0;
      border-radius: 12px;
      background: rgba(255,255,255,.16);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    .withdraw-header h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
    }

    .withdraw-header p {
      margin: 3px 0 0;
      font-size: 11px;
      opacity: .9;
    }

    .withdraw-content {
      padding: 16px;
    }

    .withdraw-card {
      background: #fff;
      border-radius: 20px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(25,35,60,.08);
    }

    .balance-box {
      padding: 18px;
      border-radius: 17px;
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      text-align: center;
      margin-bottom: 19px;
    }

    .balance-box small {
      display: block;
      font-size: 11px;
      opacity: .9;
    }

    .balance-box strong {
      display: block;
      margin-top: 5px;
      font-size: 29px;
      font-weight: 800;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #30394b;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      min-height: 46px;
      box-sizing: border-box;
      padding: 11px 13px;
      border: 1px solid #dce2eb;
      border-radius: 12px;
      background: #f9fbff;
      color: #20283a;
      font-size: 14px;
      outline: none;
    }

    .field input:focus {
      border-color: #1769e0;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(23,105,224,.08);
    }

    .withdraw-submit {
      width: 100%;
      min-height: 47px;
      border: 0;
      border-radius: 13px;
      margin-top: 3px;
      background: linear-gradient(135deg, #1769e0, #0755c9);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(23,105,224,.20);
    }

    .withdraw-submit:active {
      transform: scale(.98);
    }

    .withdraw-note {
      margin-top: 14px;
      padding: 12px;
      border-radius: 12px;
      background: #f3f7ff;
      color: #69758a;
      font-size: 11px;
      line-height: 17px;
      text-align: center;
    }

    .history-title {
      margin: 17px 2px 10px;
      color: #20283a;
      font-size: 17px;
      font-weight: 800;
    }

    .history-card {
      background: #fff;
      border-radius: 17px;
      padding: 18px;
      box-shadow: 0 6px 20px rgba(25,35,60,.07);
    }

    .history-empty {
      text-align: center;
      color: #7d8798;
      font-size: 13px;
      padding: 8px 0;
    }

    .history-icon {
      font-size: 27px;
      margin-bottom: 7px;
    }

    .native-ad {
      width: 100%;
      min-height: 100px;
      margin: 12px 0;
      border-radius: 15px;
      overflow: hidden;
      background: #fff;
    }

    .bottom-banner {
      width: 320px;
      height: 50px;
      max-width: calc(100vw - 10px);
      margin: 10px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
  </style>
</head>

<body>

<div class="withdraw-page">

  <!-- TOP 320x50 AD -->
  <div class="top-ad">

    <script>
      atOptions = {
        'key' : 'b529261b98306ae1169a6bf5b991c3d4',
        'format' : 'iframe',
        'height' : 50,
        'width' : 320,
        'params' : {}
      };
    </script>

    <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

  </div>


  <!-- HEADER -->
  <header class="withdraw-header">

    <button
      class="back-button"
      onclick="history.back()"
      aria-label="Go back">
      ←
    </button>

    <div>
      <h1>Withdraw</h1>
      <p>Withdraw your earned balance</p>
    </div>

  </header>


  <main class="withdraw-content">

    <!-- WITHDRAW CARD -->
    <section class="withdraw-card">

      <div class="balance-box">

        <small>
          Available Balance
        </small>

        <strong>
          <span id="withdrawBalance">0.00</span>
          coins
        </strong>

      </div>


      <div class="field">

        <label for="payment">
          Payment Method / Number
        </label>

        <input
          id="payment"
          type="text"
          placeholder="bKash / Nagad Number"
          autocomplete="off"
        >

      </div>


      <div class="field">

        <label for="amount">
          Withdrawal Amount
        </label>

        <input
          id="amount"
          type="number"
          min="510"
          max="5000"
          step="1"
          placeholder="Amount (510 - 5000)"
        >

      </div>


      <button
        class="withdraw-submit"
        onclick="submitWithdraw()">
        Submit Withdraw
      </button>


      <div class="withdraw-note">
        Minimum withdrawal: 510 coins.<br>
        Maximum withdrawal: 5000 coins per request.<br>
        Please make sure your payment number is correct.
      </div>

    </section>


    <!-- WITHDRAWAL HISTORY -->
    <h2 class="history-title">
      Withdrawal History
    </h2>

    <section class="history-card">

      <div class="history-empty">

        <div class="history-icon">
          💳
        </div>

        <div>
          No withdrawal history yet.
        </div>

      </div>

    </section>


    <!-- NATIVE 2:1 -->
    <section class="native-ad">

      <script
        async="async"
        data-cfasync="false"
        src="https://pl28546803.profitableratecpmnetwork.com/80507bc8e3d998279cd413247931169e/invoke.js">
      </script>

      <div id="container-80507bc8e3d998279cd413247931169e"></div>

    </section>


    <!-- BELOW NATIVE 320x50 -->
    <div class="bottom-banner">

      <script>
        atOptions = {
          'key' : 'b529261b98306ae1169a6bf5b991c3d4',
          'format' : 'iframe',
          'height' : 50,
          'width' : 320,
          'params' : {}
        };
      </script>

      <script src="https://www.highrevenueformat.com/b529261b98306ae1169a6bf5b991c3d4/invoke.js"></script>

    </div>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <a href="index.html">
      <span class="nav-icon">⌂</span>
      <span>Home</span>
    </a>

    <a href="https://lsr-video-downloaders.vercel.app/">

    <a

      rel="noopener noreferrer">
      <span class="nav-icon">✈</span>
      <span>Telegram</span>
    </a>

    <a href="profile.html">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </a>

    <a href="more.html">
      <span class="nav-icon">☰</span>
      <span>More</span>
    </a>

  </nav>

</div>


<script src="app.js"></script>


<script>

/* =========================================================
   LOAD BALANCE
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    const balance =
      Number(
        localStorage.getItem(
          "worker_balance"
        ) || "0"
      );

    const element =
      document.getElementById(
        "withdrawBalance"
      );

    if (element) {

      element.textContent =
        balance.toFixed(2);

    }

  }
);


/* =========================================================
   SUBMIT WITHDRAW
   Existing validation + Smartlink preserved
========================================================= */

function submitWithdraw() {

  const payment =
    document
      .getElementById("payment")
      .value
      .trim();


  const amount =
    Number(
      document
        .getElementById("amount")
        .value
    );


  if (!payment) {

    alert(
      "Please enter your bKash / Nagad number."
    );

    return;

  }


  if (
    !amount ||
    amount < 510 ||
    amount > 5000
  ) {

    alert(
      "Withdrawal amount must be between 510 and 5000 coins."
    );

    return;

  }


  const balance =
    Number(
      localStorage.getItem(
        "worker_balance"
      ) || "0"
    );


  if (amount > balance) {

    alert(
      "Insufficient balance."
    );

    return;

  }


  /*
    Smartlink is triggered by the user's
    explicit Submit Withdraw action.
  */

  if (
    typeof openSmartlink === "function"
  ) {

    openSmartlink();

  }


  alert(
    "Withdrawal request submitted successfully."
  );

}

</script>

</body>
</html>
