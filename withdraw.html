      }

      }

      }
    }
  </style>

  <!-- =========================
       FIREBASE WITHDRAW LOGIC
  ========================= -->

  <script>

    let currentUser = null;
    let currentBalance = 0;

    const MIN_WITHDRAWAL = 510;


    /* =========================
       ELEMENTS
    ========================= */

    const balanceElement =
      document.getElementById("balance");

    const withdrawCard =
      document.getElementById("withdrawCard");

    const loginMessage =
      document.getElementById("loginMessage");

    const withdrawalList =
      document.getElementById("withdrawalList");

    const messageElement =
      document.getElementById("withdrawMessage");

    const withdrawButton =
      document.getElementById("withdrawButton");


    /* =========================
       HELPERS
    ========================= */

    function escapeHtml(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function showMessage(
      text,
      type = "info"
    ) {

      messageElement.innerHTML =
        `<div class="status ${type}">
          ${escapeHtml(text)}
        </div>`;

    }


    function formatMoney(value) {

      return Number(value || 0).toFixed(2);

    }


    function formatDate(timestamp) {

      if (!timestamp) {
        return "";
      }

      try {

        if (
          timestamp &&
          typeof timestamp.toDate === "function"
        ) {

          return timestamp
            .toDate()
            .toLocaleString();

        }

        return new Date(timestamp)
          .toLocaleString();

      } catch (error) {

        return "";

      }

    }


    function normalizeStatus(status) {

      return String(status || "Pending")
        .toLowerCase();

    }


    /* =========================
       SHOW LOGGED OUT
    ========================= */

    function showLoggedOut() {

      withdrawCard
        .classList.add("hidden");

      loginMessage
        .classList.remove("hidden");

      balanceElement.textContent =
        "0.00";

      currentBalance = 0;

      withdrawalList.innerHTML =
        `<div class="status info">
          Please login to view withdrawal history.
        </div>`;

    }


    /* =========================
       LOAD WALLET
    ========================= */

    async function loadWallet() {

      if (!currentUser) {
        return;
      }

      try {

        const walletRef =
          window.firebaseDb
            .collection("wallets")
            .doc(currentUser.uid);

        const walletSnap =
          await walletRef.get();

        if (!walletSnap.exists) {

          currentBalance = 0;

          balanceElement.textContent =
            "0.00";

          return;

        }

        const walletData =
          walletSnap.data() || {};

        currentBalance =
          Number(walletData.balance || 0);

        balanceElement.textContent =
          formatMoney(currentBalance);

      } catch (error) {

        console.error(
          "Wallet loading error:",
          error
        );

        showMessage(
          "Unable to load your balance.",
          "error"
        );

      }

    }


    /* =========================
       LOAD WITHDRAWAL HISTORY
    ========================= */

    async function loadWithdrawals() {

      if (!currentUser) {
        return;
      }

      withdrawalList.innerHTML =
        `<div class="status info">
          Loading withdrawal history...
        </div>`;

      try {

        const snapshot =
          await window.firebaseDb
            .collection("withdrawals")
            .where(
              "userId",
              "==",
              currentUser.uid
            )
            .get();

        if (snapshot.empty) {

          withdrawalList.innerHTML =
            `<div class="status info">
              No withdrawal requests yet.
            </div>`;

          return;

        }


        const items = [];

        snapshot.forEach(doc => {

          const data =
            doc.data() || {};

          items.push({
            id: doc.id,
            ...data
          });

        });


        items.sort((a, b) => {

          const aTime =
            a.requestedAt &&
            typeof a.requestedAt.toMillis === "function"
              ? a.requestedAt.toMillis()
              : 0;

          const bTime =
            b.requestedAt &&
            typeof b.requestedAt.toMillis === "function"
              ? b.requestedAt.toMillis()
              : 0;

          return bTime - aTime;

        });


        withdrawalList.innerHTML =
          items.map(item => {

            const status =
              String(
                item.status || "Pending"
              );

            const statusClass =
              normalizeStatus(status);

            return `

              <div class="history-item">

                <div class="history-top">

                  <span class="history-amount">
                    ৳${formatMoney(item.amount)}
                  </span>

                  <span class="history-status ${statusClass}">
                    ${escapeHtml(status)}
                  </span>

                </div>

                <div class="history-line">
                  Payment:
                  ${escapeHtml(item.method || "")}
                </div>

                <div class="history-line">
                  Account:
                  ${escapeHtml(item.accountDetails || "")}
                </div>

                <div class="history-line">
                  Requested:
                  ${escapeHtml(
                    formatDate(item.requestedAt)
                  )}
                </div>

                ${
                  item.adminNote
                    ? `
                      <div class="history-line">
                        Note:
                        ${escapeHtml(item.adminNote)}
                      </div>
                    `
                    : ""
                }

              </div>

            `;

          }).join("");


      } catch (error) {

        console.error(
          "Withdrawal history error:",
          error
        );

        withdrawalList.innerHTML =
          `<div class="status error">
            Unable to load withdrawal history.
          </div>`;

      }

    }


    /* =========================
       REQUEST WITHDRAWAL
    ========================= */

    async function requestWithdrawal() {

      if (!currentUser) {

        window.location.href =
          "login.html";

        return;

      }


      const amount =
        Number(
          document
            .getElementById("withdrawAmount")
            .value
        );


      const method =
        document
          .getElementById("withdrawMethod")
          .value;


      const accountDetails =
        document
          .getElementById("accountDetails")
          .value
          .trim();


      /* =========================
         VALIDATION
      ========================= */

      if (
        !Number.isInteger(amount) ||
        amount <= 0
      ) {

        showMessage(
          "Enter a valid withdrawal amount.",
          "error"
        );

        return;

      }


      if (amount < MIN_WITHDRAWAL) {

        showMessage(
          "Minimum withdrawal amount is 510 Coins.",
          "error"
        );

        return;

      }


      if (!method) {

        showMessage(
          "Select a payment method.",
          "error"
        );

        return;

      }


      if (!accountDetails) {

        showMessage(
          "Enter your payment account.",
          "error"
        );

        return;

      }


      if (amount > currentBalance) {

        showMessage(
          "Insufficient balance.",
          "error"
        );

        return;

      }


      /* =========================
         CONFIRM
      ========================= */

      const confirmed =
        window.confirm(
          `Withdraw ${amount} Coins using ${method}?`
        );

      if (!confirmed) {
        return;
      }


      withdrawButton.disabled = true;

      withdrawButton.textContent =
        "Processing...";

      showMessage(
        "Processing your withdrawal request...",
        "info"
      );


      try {

        const db =
          window.firebaseDb;


        const walletRef =
          db
            .collection("wallets")
            .doc(currentUser.uid);


        const withdrawalRef =
          db
            .collection("withdrawals")
            .doc();


        /*
          IMPORTANT:

          Wallet deduction + withdrawal creation
          happen inside ONE Firestore transaction.

          This prevents:
          - duplicate deduction
          - request without balance deduction
          - balance deduction without request
        */

        await db.runTransaction(
          async transaction => {

            const walletSnap =
              await transaction.get(walletRef);


            if (!walletSnap.exists) {

              throw new Error(
                "Wallet not found."
              );

            }


            const walletData =
              walletSnap.data() || {};


            const balance =
              Number(
                walletData.balance || 0
              );


            if (balance < amount) {

              throw new Error(
                "Insufficient balance."
              );

            }


            if (amount < MIN_WITHDRAWAL) {

              throw new Error(
                "Minimum withdrawal amount is 510 Coins."
              );

            }


            const newBalance =
              Number(
                (balance - amount).toFixed(2)
              );


            transaction.update(
              walletRef,
              {
                balance: newBalance,
                updatedAt:
                  firebase.firestore.FieldValue.serverTimestamp()
              }
            );


            transaction.set(
              withdrawalRef,
              {

                userId:
                  currentUser.uid,

                amount:
                  amount,

                method:
                  method,

                accountDetails:
                  accountDetails,

                status:
                  "Pending",

                requestedAt:
                  firebase.firestore.FieldValue.serverTimestamp(),

                processedAt:
                  null,

                adminNote:
                  "",

                refundProcessed:
                  false

              }
            );

          }
        );


        /* =========================
           SUCCESS
        ========================= */

        document
          .getElementById("withdrawAmount")
          .value = "";

        document
          .getElementById("accountDetails")
          .value = "";


        showMessage(
          "Withdrawal request submitted successfully.",
          "success"
        );


        await loadWallet();

        await loadWithdrawals();


      } catch (error) {

        console.error(
          "Withdrawal request error:",
          error
        );


        let errorMessage =
          "Unable to submit withdrawal request.";


        if (
          error &&
          error.message
        ) {

          errorMessage =
            error.message;

        }


        showMessage(
          errorMessage,
          "error"
        );


      } finally {

        withdrawButton.disabled = false;

        withdrawButton.textContent =
          "Submit Withdraw";

      }

    }


    /* =========================
       FIREBASE AUTH LISTENER
    ========================= */

    window.firebaseAuth
      .onAuthStateChanged(
        async user => {

          if (user) {

            currentUser = user;

            withdrawCard
              .classList.remove("hidden");

            loginMessage
              .classList.add("hidden");


            await loadWallet();

            await loadWithdrawals();

          } else {

            currentUser = null;

            showLoggedOut();

          }

        }
      );

  </script>
